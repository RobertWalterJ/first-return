<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0d0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
</head>
<body>
<title>First Return</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --void:#040506; --panel:#0b0d0f; --raise:#141a1e; --line:#1e2429; --line2:#2d363d;
  --text:#e2e8eb; --dim:#8b98a1; --faint:#5a6770;
  --accent:#72e8cb; --accent-ink:#03140f; --rec:#ff5a4e;
  --ui:Archivo,"Helvetica Neue",Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--void);color:var(--text);font:15px/1.4 var(--ui)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- frame: top bar, picture, tools ---------- */
.app{display:grid;height:100vh;height:100dvh;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "stage" "side"}
.top{grid-area:top;display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-weight:780;font-stretch:125%;letter-spacing:.07em;text-transform:uppercase;font-size:15px;margin-right:auto;white-space:nowrap}
.brand span{color:var(--accent)}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;padding:4px 6px;border:0;background:none;border-radius:6px;font-size:11.5px;color:var(--dim)}
.tb svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb:hover,.tb[aria-expanded="true"]{background:var(--raise);color:var(--text)}
.tb.primary svg{stroke:var(--accent)} .tb.primary{color:var(--accent)}

.stage{grid-area:stage;position:relative;overflow:hidden;background:var(--void);touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{position:absolute;display:block;outline:none;cursor:grab}
.stage.picking canvas{cursor:crosshair}
.compare{position:absolute;pointer-events:none;object-fit:fill}
.overlay{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;color:#fff;font-weight:560;text-shadow:0 0 6px rgba(255,255,255,.55),0 0 16px rgba(255,255,255,.28)}
.pin{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid var(--accent);background:rgba(114,232,203,.25);pointer-events:none}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:calc(100% - 24px);background:rgba(8,10,12,.86);border:1px solid var(--line2);border-radius:18px;padding:7px 14px;font-size:14px;text-align:center;pointer-events:none}
.float{position:absolute;right:10px;bottom:10px;display:flex;gap:8px}
.fb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:rgba(10,12,14,.8);display:grid;place-items:center;padding:0}
.fb svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fb[aria-pressed="true"]{border-color:var(--accent)} .fb[aria-pressed="true"] svg{stroke:var(--accent)}
.recbar{position:absolute;left:0;right:0;top:0;height:3px;background:var(--line)}
.recbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--rec)}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,5,6,.74);text-align:center;padding:24px;font-size:15px}
.busy .bar{width:min(260px,70vw);height:3px;background:var(--line2);margin:12px auto 0;position:relative;overflow:hidden;border-radius:2px}
.busy .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0}

/* ---------- tools: tabs + one tray ---------- */
.side{grid-area:side;display:flex;flex-direction:column-reverse;background:var(--panel);border-top:1px solid var(--line);min-height:0}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:var(--safe-b)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border:0;background:none;color:var(--dim);font-size:12px;border-top:2px solid transparent}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
.tray{padding:12px 14px 10px;border-bottom:1px solid var(--line);overflow-y:auto;max-height:44vh}
.tray h3{margin:0 0 8px;font-size:11.5px;font-weight:620;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-stretch:112%;display:flex;align-items:center;gap:8px}
.tray h3 .sp{margin-left:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line2);background:var(--raise);border-radius:18px;padding:8px 13px;font-size:14px;line-height:1.1;white-space:nowrap;position:relative}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:#0f2621}
.chip.def::after{content:"";position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--dim)}
.chip:disabled{opacity:.4;cursor:default}
.btn{border:1px solid var(--line2);background:var(--raise);border-radius:8px;padding:10px 14px;font-weight:560;line-height:1.1}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#1a0302}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.hint{color:var(--dim);font-size:13.5px;margin:8px 0 0;display:flex;gap:8px;align-items:center}
.say{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--raise);display:grid;place-items:center;padding:0}
.say svg{width:16px;height:16px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.looks{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.look{flex:none;width:104px;border:1px solid var(--line2);background:var(--raise);border-radius:8px;padding:5px;display:flex;flex-direction:column;gap:5px;text-align:left}
.look canvas{width:100%;height:78px;border-radius:5px;background:#000;display:block;object-fit:cover}
.look b{font-size:13.5px;font-weight:620;padding:0 3px}
.look[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.look[aria-pressed="true"] b{color:var(--accent)}
.stepper{margin-top:12px}
.stepper input{width:100%;height:36px;accent-color:var(--accent);margin:0}
.stops{display:flex;justify-content:space-between;margin-top:2px}
.stops button{border:0;background:none;color:var(--dim);font-size:12.5px;padding:4px 2px;min-width:44px}
.stops button:first-child{text-align:left} .stops button:last-child{text-align:right}
.stops button[aria-current="true"]{color:var(--accent);font-weight:640}
.sect{margin-top:14px}
.lablist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.lablist div{display:flex;gap:6px}
.lablist input{flex:1;min-width:0;background:var(--raise);border:1px solid var(--line2);border-radius:8px;padding:9px 10px}
.menu{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu button{text-align:left;border:0;background:none;padding:10px 12px;border-radius:6px;font-size:14.5px}
.menu button:hover,.menu button[aria-pressed="true"]{background:var(--raise)}
.menu button[aria-pressed="true"]{color:var(--accent)}
.menu small{display:block;color:var(--dim);font-size:12px}
.sheet{position:fixed;inset:0;background:rgba(2,3,4,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px 16px;z-index:30}
.sheet img,.sheet video{max-width:100%;max-height:70vh;border:1px solid var(--line2);background:#000;-webkit-touch-callout:default}
.sheet p{margin:0;color:var(--dim);text-align:center;max-width:52ch}
.info{position:fixed;z-index:25;inset:auto 12px 12px 12px;max-width:420px;margin-left:auto;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--dim)}
.info b{color:var(--text)}
.info p{margin:0 0 8px}

@media (max-width:420px){ .brand{font-size:12.5px;letter-spacing:.04em} .tb{min-width:44px;padding:4px 3px} .top{gap:2px;padding:6px 8px} }
@media (min-width:900px){
  .app{grid-template-columns:minmax(0,1fr) 370px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "stage side"}
  .side{flex-direction:column;border-top:0;border-left:1px solid var(--line)}
  .tabs{border-bottom:1px solid var(--line);padding-bottom:0}
  .tab{border-top:0;border-bottom:2px solid transparent}
  .tab[aria-selected="true"]{border-bottom-color:var(--accent)}
  .tray{max-height:none;flex:1;border-bottom:0;padding:16px 18px}
  .looks{display:grid;grid-template-columns:1fr 1fr;overflow:visible} .look{width:auto} .look canvas{height:auto;aspect-ratio:4/3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">First <span>Return</span></div>
    <label class="tb primary" for="file" role="button" tabindex="0"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>Open</label>
    <input id="file" type="file" accept="image/*" hidden>
    <button class="tb" id="shapeBtn" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M6 3v15h15"/><path d="M3 6h15v15"/></svg>Shape</button>
    <button class="tb" id="saveBtn" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>Save</button>
    <button class="tb" id="infoBtn" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.5v.5"/></svg>About</button>
  </header>

  <div class="stage" id="stage">
    <canvas id="gl" tabindex="0" aria-label="The point cloud. Drag to turn it, pinch or scroll to zoom, double tap to line it up with the photo again."></canvas>
    <img class="compare" id="compare" alt="" hidden>
    <div class="overlay" id="pins"></div>
    <div class="overlay" id="labels"></div>
    <div class="banner" id="banner" hidden></div>
    <div class="recbar" id="recbar" hidden><i id="recfill"></i></div>
    <div class="float">
      <button class="fb" id="photoView" aria-label="Line up with the photo" title="Line up with the photo" hidden><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/></svg></button>
      <button class="fb" id="panBtn" aria-pressed="false" aria-label="Pan: drag slides the view" title="Pan: drag slides the view"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><path d="M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg></button>
      <button class="fb" id="spin" aria-pressed="false" aria-label="Turntable" title="Turntable"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="15" rx="8" ry="3"/><path d="M12 12V4"/><path d="M16 7l-4-3-4 3"/></svg></button>
      <button class="fb" id="compareBtn" aria-label="Hold to see the original photo" title="Hold to see the original photo"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/><path d="M12 9l9 6"/></svg></button>
    </div>
    <div class="busy" id="busy" hidden><div><div id="busyText">Working</div><div class="bar"><i id="busyBar"></i></div></div></div>
  </div>

  <aside class="side">
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="look"><svg viewBox="0 0 24 24"><circle cx="7" cy="8" r="1.4"/><circle cx="12" cy="6" r="1.4"/><circle cx="17" cy="8" r="1.4"/><circle cx="9" cy="13" r="1.4"/><circle cx="15" cy="13" r="1.4"/><circle cx="12" cy="18" r="1.4"/></svg>Look</button>
      <button class="tab" role="tab" data-tab="adjust"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Adjust</button>
      <button class="tab" role="tab" data-tab="subject"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Subject</button>
      <button class="tab" role="tab" data-tab="move"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>Move</button>
      <button class="tab" role="tab" data-tab="people"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/></svg>People</button>
    </nav>
    <section class="tray" id="tray"></section>
  </aside>
</div>

<div class="menu" id="shapeMenu" hidden></div>
<div class="menu" id="saveMenu" hidden></div>
<div class="info" id="info" hidden></div>
<div class="sheet" id="sheet" hidden>
  <img id="sheetImg" alt="Your picture">
  <video id="sheetVid" controls loop muted playsinline hidden></video>
  <p id="sheetNote"></p>
  <div class="row"><a class="btn primary" id="sheetDl" href="#">Download</a><button class="btn" id="sheetClose">Close</button></div>
</div>

<script>
(() => {
'use strict';
// ---------------------------------------------------------------- core: constants, state, settings
const $ = s => document.querySelector(s);
const MOBILE = matchMedia('(pointer:coarse)').matches;
const MAXPTS = MOBILE ? 520000 : 1150000;
const WIDE = () => matchMedia('(min-width:900px)').matches;

// Every adjustable setting has named stops. The slider moves smoothly between them and snaps
// to a stop when you tap its name, so there is always a sensible preset one tap away.
const CONTROLS = [
  {key:'dots',     name:'Dots',       hint:'How many dots make up the picture.', rebuild:true,
   stops:[['Few',6],['Some',28],['Many',55],['Lots',75],['Max',92]]},
  {key:'size',     name:'Dot size',   hint:'How big each dot is.',
   stops:[['Fine',.55],['Small',.8],['Medium',1.05],['Big',1.5],['Huge',2.3]]},
  {key:'glow',     name:'Glow',       hint:'Light that spills around the bright dots.',
   stops:[['Off',0],['Soft',.45],['Medium',.9],['Strong',1.4],['Bloom',2.1]]},
  {key:'bright',   name:'Brightness', hint:'How bright the dots are.',
   stops:[['Dim',.6],['Soft',.9],['Normal',1.25],['Bright',1.8],['Blazing',2.7]]},
  {key:'light',    name:'Light',      hint:'Evens out the photo\'s lighting so dark or backlit subjects still show. Real lidar sees surfaces, not sunlight.',
   stops:[['As shot',0],['Lifted',.5],['Even',1]]},
  {key:'colour',   name:'Colour',     hint:'What decides the colour of each dot.', chips:[
     ['photo','Photo'],['muted','Muted'],['grey','Grey'],['range','Distance'],['height','Height'],['phosphor','Green']]},
  {key:'depth3d',  name:'3D',         hint:'How far near things stand out from far things. Easiest to see when you turn the view.', rebuild:true,
   stops:[['Flat',.08],['Low',.5],['Normal',1],['Deep',1.6],['Extra',2.4]]},
  {key:'backdrop', name:'Backdrop',   hint:'Dots behind and around the subject.', rebuild:true,
   stops:[['None',0],['Faint',.12],['Some',.4],['Full',1]]},
  {key:'floor',    name:'Floor',      hint:'A scatter of dots on the ground under the subject.', rebuild:true,
   stops:[['Off',0],['Light',.55],['Full',1.1]]},
  {key:'edges',    name:'Edges',      hint:'Dark outlines where near meets far, the way lidar viewers shade a scan.',
   stops:[['Off',0],['Soft',.9],['Strong',2.2]]},
];
const CTRL = Object.fromEntries(CONTROLS.map(c=>[c.key,c]));

// Looks set every control plus a few things that are part of the style itself.
// Control values are positions on the stops (0 = first stop, 1 = second, fractions in between).
const LOOKS = {
  void:    {name:'Void',    dots:3.05, size:1.9, glow:1.9, bright:2.3, colour:'photo',  depth3d:2, backdrop:1.05, floor:1.3, edges:0,
            pattern:'scatter', bgTint:1, bgGain:.45, bgSize:2.4, sparkle:0, yaw:0, pitch:0, zoom:1.3},
  sparse:  {name:'Sparse',  dots:1.45, size:2.7, glow:2.4, bright:3.1, colour:'muted',  depth3d:2, backdrop:0,    floor:1.55, edges:0,
            pattern:'scatter', bgTint:1, bgGain:.4, bgSize:2, sparkle:1, yaw:0, pitch:0, zoom:1.3},
  scanner: {name:'Scanner', dots:1.8,  size:1.4, glow:1.0, bright:1.7, colour:'range',  depth3d:2, backdrop:3,    floor:0,   edges:1,
            pattern:'rings',   bgTint:0, bgGain:1, bgSize:1, sparkle:0, yaw:24, pitch:14, zoom:2.2},
  survey:  {name:'Survey',  dots:2.85, size:1.2, glow:.55, bright:1.4, colour:'height', depth3d:2, backdrop:3,    floor:0,   edges:1.6,
            pattern:'scatter', bgTint:0, bgGain:1, bgSize:1, sparkle:0, yaw:18, pitch:10, zoom:1.6},
};
const LOOK_KEYS = ['dots','size','glow','bright','colour','depth3d','backdrop','floor','edges','pattern'];

const P = {};            // the live settings
let look = 'void';

const S = {
  photoSrc:null, photo:null,       // {w,h,data} untouched, and the copy the cloud is built from (anonymised when asked)
  depthSrc:null, depth:null,       // {w,h,d} 0..1, 1 = near
  photoURL:null,                   // for the hold-to-compare view
  tanV:Math.tan(25*Math.PI/180),   // half of the vertical field of view, as a tangent
  fovSource:'assumed',
  shiftAuto:0.25, plane:null, ground:null, autoCut:0.5,
  picks:[], band:1, pickMask:null, segMask:null, // chosen subject
  comps:[], compMap:null, nComp:0,
  labels:[], placing:false,
  faces:[], anon:false, anonLevel:1, faceMask:null, facesFound:false,
  yaw:0, pitch:0, zoom:1, target:[0,0,-2], spin:false,
  planes:[], floorTouched:false, autoLight:false, autoFind:true,
  pivot:[0,0,-2], pan:[0,0,0], refDist:2, userMoved:false, panMode:false,   // where turning is centred, and how far the view has slid
  count:0, cpu:null, rng:[1,2], yr:[0,1], floor3d:null,
  dirtyBuild:true, dirtyDraw:true, lowDetail:false, recording:false,
  tab:null, ctrl:'dots', undo:[], shape:'photo'
};

// ---------------------------------------------------------------- small helpers
function val(key){ const c=CTRL[key], p=Math.max(0,Math.min(c.stops.length-1,P[key])), i=Math.min(c.stops.length-2,Math.floor(p)), f=p-i;
  return c.stops[i][1]*(1-f)+c.stops[i+1][1]*f; }
function hash2(x, y, s){ let h = Math.imul(x|0, 374761393) ^ Math.imul(y|0, 668265263) ^ Math.imul(s|0, 2246822519);
  h = Math.imul(h ^ (h>>>13), 1274126177); return ((h ^ (h>>>16))>>>0)/4294967296; }
function seeded(seed){ let a=seed>>>0; return () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function gauss(r){ return Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(6.283185*r()); }
const tick = () => new Promise(r=>setTimeout(r,30));
function busy(text, frac){ const b=$('#busy'); if (text==null){ b.hidden=true; return; } b.hidden=false; $('#busyText').textContent=text; $('#busyBar').style.width = frac==null ? '100%' : (Math.min(1,frac)*100).toFixed(1)+'%'; }
function banner(text){ const b=$('#banner'); b.hidden=!text; if (text) b.textContent=text; }
function store(k,v){ try{ localStorage.setItem('firstreturn.'+k, JSON.stringify(v)); }catch(e){} }
function recall(k){ try{ const v=localStorage.getItem('firstreturn.'+k); return v==null?null:JSON.parse(v); }catch(e){ return null; } }
function say(text){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=0.95; speechSynthesis.speak(u); }catch(e){} }
function loadScript(src){ return new Promise((res,rej)=>{ if (document.querySelector(`script[data-src="${src}"]`)) return res(); const s=document.createElement('script'); s.src=src; s.dataset.src=src; s.onload=res; s.onerror=()=>rej(new Error('could not load '+src)); document.head.appendChild(s); }); }

const M4 = {

// ---------------------------------------------------------------- optional sharper outline (MediaPipe Magic Touch)
let segmenter = null, segFailed = false, visionFiles = null;

}
async function loadSegmenter(){

    const fileset = await visionFileset();
    segmenter = await Vision.InteractiveSegmenterLegacy.createFromOptions(fileset, {
      baseOptions:{modelAssetPath:new URL('models/magic_touch.tflite', location.href).href, delegate:'CPU'},
      outputCategoryMask:true, outputConfidenceMasks:false});
  } catch(err){ console.error(err); segFailed = true; segmenter = null; }
  busy(null);

}
async function outlineFor(u, v, stroke){
  const seg = await loadSegmenter(); if (!seg) return null;
  busy('Finding the outline', null); await tick();
  try {
    const res = seg.segment(S.photoCanvas, stroke ? {scribble:stroke} : {keypoint:{x:u, y:v}});
    const m = res.categoryMask, mw = m.width, mh = m.height, a = m.getAsUint8Array();
    // resample to the depth grid; the tapped pixel tells us which value means "selected"
    const on = a[Math.min(mh-1,(v*mh)|0)*mw + Math.min(mw-1,(u*mw)|0)];
    const D=S.depth, out=new Uint8Array(D.w*D.h); let count=0;
    for (let y=0;y<D.h;y++) for (let x=0;x<D.w;x++){ const s=a[Math.min(mh-1,((y+.5)/D.h*mh)|0)*mw + Math.min(mw-1,((x+.5)/D.w*mw)|0)]; if (s===on){ out[y*D.w+x]=1; count++; } }
    res.close(); busy(null);

// ---------------------------------------------------------------- find people and things (MediaPipe object detector)
// Depth alone cannot tell that the person behind the dinner table is the point of the photo. A small
// object detector (EfficientDet Lite0, Apache 2.0) finds people, animals and vehicles; each one is then
// outlined with Magic Touch using a stroke down its middle, kept inside its box, and checked against depth.
let detector = null, detFailed = false;
const SKIP = new Set(['dining table','chair','bench','couch','bed','potted plant','tv','toilet','sink','refrigerator','oven','microwave','book','vase','clock','cup','bowl','bottle','wine glass','fork','knife','spoon','cell phone','remote','keyboard','mouse','laptop']);
async function loadDetector(){
  if (detector || detFailed) return detector;
  try {
    busy('Getting the finder, first time only', null); await tick();
    const fileset = await visionFileset();
    detector = await Vision.ObjectDetector.createFromOptions(fileset, {
      baseOptions:{modelAssetPath:new URL('models/efficientdet_lite0.tflite', location.href).href, delegate:'CPU'},
      scoreThreshold:0.35, maxResults:12, runningMode:'IMAGE'});
  } catch(err){ console.error(err); detFailed = true; detector = null; }
  busy(null);
  return detector;
}
async function findThings(){
  const det = await loadDetector(); if (!det) return null;
  busy('Looking for people and things', null); await tick();
  const W = S.photoCanvas.width, H = S.photoCanvas.height;
  let found = [];
  try {
    const r = det.detect(S.photoCanvas);
    for (const d of r.detections){
      const c = d.categories[0]; if (!c || SKIP.has(c.categoryName)) continue;
      const b = d.boundingBox, x0=b.originX/W, y0=b.originY/H, x1=(b.originX+b.width)/W, y1=(b.originY+b.height)/H;
      if ((x1-x0)*(y1-y0) < 0.004) continue;
      found.push({name:c.categoryName, score:c.score, box:[x0,y0,x1,y1]});
    }
  } catch(err){ console.error(err); busy(null); return null; }
  // people first, then the biggest things; at most five
  const area = f => (f.box[2]-f.box[0])*(f.box[3]-f.box[1]);
  found.sort((a,b)=>((b.name==='person')-(a.name==='person')) || (area(b)-area(a)));
  found = found.slice(0, MOBILE ? 3 : 5);
  const picks = [];
  for (const f of found){
    const [x0,y0,x1,y1] = f.box, cx=(x0+x1)/2, pad=0.04;
    const stroke = [0.25,0.4,0.55,0.7].map(t=>({x:cx, y:y0+(y1-y0)*t}));
    const seg = await outlineFor(cx, (y0+y1)/2, stroke);
    picks.push({u:cx, v:y0+(y1-y0)*0.4, seg, name:f.name,
      box:[Math.max(0,x0-pad),Math.max(0,y0-pad),Math.min(1,x1+pad),Math.min(1,y1+pad)]});

  busy(null);
  return picks;
}

function frameAspect(){ const pa = S.photo ? S.photo.w/S.photo.h : 1;
  return S.shape==='wide'?16/9:S.shape==='square'?1:S.shape==='tall'?9/16:pa; }
function viewMatrix(yaw, pitch, zoom, pivot, pan){
  // yaw = pitch = 0, zoom = 1 and no pan is exactly the photo's own viewpoint. Turning happens about
  // the pivot; pan slides the camera in its own plane (and along its axis when the pivot is re-centred).
  const t = pivot || S.target, pn = pan || [0,0,0], back = (zoom-1)*S.refDist;
  const R = M4.mul(M4.rx(pitch*Math.PI/180), M4.ry(yaw*Math.PI/180));

function viewTan(aspect){ const pa = S.photo ? S.photo.w/S.photo.h : 1; return aspect < pa ? S.tanV*pa/aspect : S.tanV; }

// ---------------------------------------------------------------- faces: find and anonymise
let faceSession = null;
async function loadFaceModel(){
  if (faceSession) return faceSession;
  await ensureOrt();
  const r = await cachedFetch('models/face-ultraface-320.onnx');
  faceSession = await ort.InferenceSession.create(new Uint8Array(await r.arrayBuffer()), {executionProviders:['wasm'], logSeverityLevel:3});
  return faceSession;

// The detector takes 320 x 240. Every crop keeps that 4:3 shape in real pixels (a portrait photo
// squeezed into it was stretched almost 2x and faces went unfound), and small faces in full-length
// shots are found in overlapping tiles.
async function detectFaces(canvas){
  const sess = await loadFaceModel(), W = canvas.width, H = canvas.height;
  const c = document.createElement('canvas'); c.width=320; c.height=240; const x=c.getContext('2d',{willReadFrequently:true});
  const crops = [];
  { const s=Math.min(320/W,240/H); crops.push({sx:0,sy:0,sw:W,sh:H,dx:(320-W*s)/2,dy:(240-H*s)/2,dw:W*s,dh:H*s}); }
  for (const f of [0.55, 0.34]){
    const tw = Math.round(Math.min(W, H*4/3)*f*(W>H?1:1.4)), th = Math.round(tw*0.75);
    if (tw < 120) continue;
    for (let y=0; y<=Math.max(0,H-th); y+=Math.max(1,Math.round(th*0.5))) for (let xx=0; xx<=Math.max(0,W-tw); xx+=Math.max(1,Math.round(tw*0.5)))
      crops.push({sx:xx,sy:y,sw:tw,sh:th,dx:0,dy:0,dw:320,dh:240});
  }
  const boxes=[];
  for (const k of crops){
    x.fillStyle='#000'; x.fillRect(0,0,320,240); x.drawImage(canvas, k.sx,k.sy,k.sw,k.sh, k.dx,k.dy,k.dw,k.dh);
    const px=x.getImageData(0,0,320,240).data, t=new Float32Array(3*76800);
    for (let i=0;i<76800;i++) for (let j=0;j<3;j++) t[j*76800+i]=(px[i*4+j]-127)/128;
    const r = await sess.run({[sess.inputNames[0]]: new ort.Tensor('float32', t, [1,3,240,320])});
    const sc=r.scores.data, bx=r.boxes.data, fx=k.sw/k.dw, fy=k.sh/k.dh;
    const thr = k.sw===W && k.sh===H ? 0.78 : 0.86;     // tiles see more clutter, so ask for more certainty
    for (let i=0;i<sc.length/2;i++) if (sc[i*2+1] > thr){
      const b=[(k.sx+(bx[i*4]*320-k.dx)*fx)/W, (k.sy+(bx[i*4+1]*240-k.dy)*fy)/H, (k.sx+(bx[i*4+2]*320-k.dx)*fx)/W, (k.sy+(bx[i*4+3]*240-k.dy)*fy)/H];

  return keep.map(f=>({cx:(f.b[0]+f.b[2])/2, cy:(f.b[1]+f.b[3])/2, rx:(f.b[2]-f.b[0])*0.7, ry:(f.b[3]-f.b[1])*0.75, auto:true}));
}

function boxBlur(src, w, h, ch, x0, y0, x1, y1, r, passes){

  const feather = (x, y, f) => Math.min(1, Math.max(0, (1.15 - Math.hypot((x-f.cx)/f.rx, (y-f.cy)/f.ry))/0.3));
  for (const f of S.faces){
    let X0=Math.max(0,Math.floor((f.cx-f.rx*1.3)*P0.w)), X1=Math.min(P0.w,Math.ceil((f.cx+f.rx*1.3)*P0.w));
    let Y0=Math.max(0,Math.floor((f.cy-f.ry*1.3)*P0.h)), Y1=Math.min(P0.h,Math.ceil((f.cy+f.ry*1.3)*P0.h));
    let mr=0,mg=0,mb=0,mn=0;
    for (let y=Y0;y<Y1;y++) for (let x=X0;x<X1;x++) if (feather((x+.5)/P0.w,(y+.5)/P0.h,f)>0.9){ const i=(y*P0.w+x)*4; mr+=P0.data[i]; mg+=P0.data[i+1]; mb+=P0.data[i+2]; mn++; }
    if (mn){ mr/=mn; mg/=mn; mb/=mn; }
    boxBlur(pd, P0.w, P0.h, 4, X0, Y0, X1, Y1, f.rx*P0.w*L.blur, 3);
    for (let y=Y0;y<Y1;y++) for (let x=X0;x<X1;x++){ const m=feather((x+.5)/P0.w,(y+.5)/P0.h,f);
      if (m>0){ const i=(y*P0.w+x)*4, mean=[mr,mg,mb];
        for (let c=0;c<3;c++){ const smeared = pd[i+c]*(1-L.flat) + mean[c]*L.flat; pOut[i+c]=P0.data[i+c]*(1-m)+smeared*m; } } }
    X0=Math.max(0,Math.floor((f.cx-f.rx*1.3)*D0.w)); X1=Math.min(D0.w,Math.ceil((f.cx+f.rx*1.3)*D0.w));
    Y0=Math.max(0,Math.floor((f.cy-f.ry*1.3)*D0.h)); Y1=Math.min(D0.h,Math.ceil((f.cy+f.ry*1.3)*D0.h));
    boxBlur(dd, D0.w, D0.h, 1, X0, Y0, X1, Y1, f.rx*D0.w*L.depth, 3);
    for (let y=Y0;y<Y1;y++) for (let x=X0;x<X1;x++){ const m=feather((x+.5)/D0.w,(y+.5)/D0.h,f);
      if (m>0){ const i=y*D0.w+x; dOut[i]=D0.d[i]*(1-m)+dd[i]*m; mask[i]=Math.max(mask[i], Math.round(m*255)); } }
  }
  S.photo={w:P0.w,h:P0.h,data:pOut}; S.depth={w:D0.w,h:D0.h,d:dOut}; S.faceMask=mask; S.dirtyBuild=true;
}
async function findFaces(){
  try { busy('Looking for faces', null); await tick();
    const found = await detectFaces(S.photoCanvas);
    S.faces = S.faces.filter(f=>!f.auto).concat(found); S.facesFound = true;
  } catch(err){ console.error(err); busy(null); banner('The face finder could not run here.'); return false; }
  busy(null); return true;
}
function addFaceAt(u, v, comp){
  // size the cover from the figure it sits on: a head is about an eighth of a standing person
  let ry = 0.05; const c = S.comps.find(k=>k.id===comp);
  if (c) ry = Math.min(0.2, Math.max(0.02, (c.maxY-c.minY)/(2*S.tanV*Math.abs(c.sz/c.n)) * 0.075));
  S.faces.push({cx:u, cy:v, rx:ry*S.photo.h/S.photo.w*0.85, ry, auto:false});
  S.anon = true; applyAnon();
}

// ---------------------------------------------------------------- saving: picture, 3D file, video
let sheetURL = null;
function showSheet(url, kind, name){

$('#sheetClose').addEventListener('click', ()=>{ $('#sheet').hidden=true; $('#sheetVid').pause(); $('#sheetVid').removeAttribute('src'); $('#sheetImg').removeAttribute('src');
  if (sheetURL){ URL.revokeObjectURL(sheetURL); sheetURL=null; } });

function drawLabels2D(x, W, H){
  const fs = H*0.03; x.save(); x.font = `560 ${fs}px Archivo, "Helvetica Neue", Arial, sans-serif`; x.textAlign='center'; x.textBaseline='bottom';
  S.labels.forEach(L=>{ if(!L.text||!L.pos) return; const s=project(L.pos,W,H); if(!s) return;
    x.fillStyle='#fff'; x.shadowColor='rgba(255,255,255,.55)'; x.shadowBlur=fs*0.5; x.fillText(L.text,s[0],s[1]); x.shadowBlur=fs*0.18; x.fillText(L.text,s[0],s[1]); });
  x.restore();
}
function withCanvasSize(W, H, fn){
  const ow=cv.width, oh=cv.height; cv.width=W; cv.height=H;
  const restore = () => { cv.width=ow; cv.height=oh; S.dirtyDraw=true; };
  let r; try { r = fn(); } catch(e){ restore(); throw e; }
  if (r && typeof r.then === 'function') return r.finally(restore);
  restore(); return r;
}
function exportSize(long){ const a=frameAspect(); const L=Math.min(long, gl.getParameter(gl.MAX_TEXTURE_SIZE));
  return a>=1 ? [L&~1, Math.round(L/a)&~1] : [Math.round(L*a)&~1, L&~1]; }
async function savePicture(){
  if (!S.count) return;
  busy('Making the picture', null); await tick();
  const [W,H] = exportSize(MOBILE ? 2048 : 2880);
  const c2 = document.createElement('canvas'); c2.width=W; c2.height=H; const x=c2.getContext('2d');
  withCanvasSize(W, H, ()=>{ draw(W,H); x.drawImage(cv,0,0); });
  drawLabels2D(x, W, H);
  c2.toBlob(b=>{ busy(null); showSheet(URL.createObjectURL(b), 'image', 'first-return.png'); }, 'image/png');
}
function savePly(){
  if (!S.count) return;
  const n=S.count, out=S.cpu;
  const head = `ply\nformat binary_little_endian 1.0\ncomment First Return point cloud, units are relative\nelement vertex ${n}\nproperty float x\nproperty float y\nproperty float z\nproperty uchar red\nproperty uchar green\nproperty uchar blue\nend_header\n`;
  const hb = new TextEncoder().encode(head), buf = new ArrayBuffer(hb.length + n*15); new Uint8Array(buf).set(hb); const dv=new DataView(buf);
  for (let i=0;i<n;i++){ const o=i*10, p=hb.length+i*15; dv.setFloat32(p,out[o],true); dv.setFloat32(p+4,out[o+1],true); dv.setFloat32(p+8,out[o+2],true);
    const g = out[o+6]===2 ? 0.25+0.6*out[o+7]**3 : 1;
    dv.setUint8(p+12,Math.min(255,out[o+3]*255*g)); dv.setUint8(p+13,Math.min(255,out[o+4]*255*g)); dv.setUint8(p+14,Math.min(255,out[o+5]*255*g)); }
  const url = URL.createObjectURL(new Blob([buf],{type:'application/octet-stream'}));
  const a = document.createElement('a'); a.href=url; a.download='first-return.ply'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
  banner(`Saved first-return.ply, ${(buf.byteLength/1e6).toFixed(1)} MB. It opens in Blender, MeshLab or CloudCompare.`);
  setTimeout(()=>banner(modeText()), 6000);
}

// ---------------------------------------------------------------- camera moves
const MOVES = {
  push:  t=>({dz:-0.32*t}),
  orbit: t=>({dy:-14+28*t}),
  drift: t=>({dz:-0.26*t, dy:-8+16*t, dp:4-4*t}),
  rise:  t=>({dy:22*t, dp:16*t, dz:-0.12*t})
};
const ease = t => 0.5-0.5*Math.cos(Math.PI*t);
function poseAt(base, move, t){ const m=MOVES[move](ease(Math.min(1,Math.max(0,t))));
  return {yaw:base.yaw+(m.dy||0), pitch:Math.max(-80,Math.min(80,base.pitch+(m.dp||0))), zoom:Math.max(0.3, base.zoom*(1+(m.dz||0)))}; }

async function previewMove(move, secs){
  if (S.recording || !S.count) return;
  const base={yaw:S.yaw,pitch:S.pitch,zoom:S.zoom}, dur=secs*1000;
  S.recording=true; S.spin=false; syncSpin(); $('#recbar').hidden=false; banner('Playing the move');
  await new Promise(res=>{ const t0=performance.now(); const step=()=>{ const el=performance.now()-t0;
    Object.assign(S, poseAt(base, move, el/dur)); draw(); renderLabels(); renderPins();
    $('#recfill').style.width=(Math.min(1,el/dur)*100)+'%'; if (el<dur) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); });
  S.recording=false; $('#recbar').hidden=true; Object.assign(S, base); S.dirtyDraw=true; banner(modeText());
}

// Frame by frame with WebCodecs: every frame is rendered at its exact time, so a slow phone makes a
// slower export, never a jerky video. Older browsers fall back to recording the screen in real time.
async function recordMove(move, secs){
  if (S.recording || !S.count) return;
  const base={yaw:S.yaw,pitch:S.pitch,zoom:S.zoom}, fps=30, hold=Math.round(fps*0.4), frames=Math.round(secs*fps)+2*hold;
  const [W,H] = exportSize(MOBILE ? 1280 : 1920);
  const rc=document.createElement('canvas'); rc.width=W; rc.height=H; const rx=rc.getContext('2d');
  const frameAt = i => { const t=(i-hold)/(frames-2*hold-1); Object.assign(S, poseAt(base, move, t)); draw(W,H); rx.drawImage(cv,0,0); drawLabels2D(rx,W,H); };
  S.recording=true; S.spin=false; syncSpin(); $('#recbar').hidden=false;
  let blob=null, ext='mp4';
  try {
    let config=null;
    if (window.VideoEncoder){
      if (!window.Mp4Muxer) await loadScript('vendor/mp4-muxer.js');
      for (const codec of ['avc1.640028','avc1.4D4028','avc1.42E028','avc1.42001f']){
        const c={codec, width:W, height:H, bitrate: MOBILE?8e6:14e6, framerate:fps};
        try { const s=await VideoEncoder.isConfigSupported(c); if (s.supported){ config=c; break; } } catch(e){}
      }
    }
    if (config){
      banner('Making the video');
      const muxer = new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(), video:{codec:'avc', width:W, height:H}, fastStart:'in-memory'});
      let failed=null;
      const enc = new VideoEncoder({output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta), error:e=>{ failed=e; }});
      enc.configure(config);
      await withCanvasSize(W, H, async ()=>{
        for (let i=0;i<frames && !failed;i++){
          frameAt(i);
          const vf = new VideoFrame(rc, {timestamp:Math.round(i*1e6/fps), duration:Math.round(1e6/fps)});
          enc.encode(vf, {keyFrame: i%60===0}); vf.close();
          while (enc.encodeQueueSize > 4) await new Promise(r=>setTimeout(r,4));
          $('#recfill').style.width=((i+1)/frames*100)+'%';
          if (i%6===0) await new Promise(r=>setTimeout(r,0));
        }
        await enc.flush();
      });
      enc.close(); if (failed) throw failed;
      muxer.finalize(); blob = new Blob([muxer.target.buffer], {type:'video/mp4'});
    } else {
      const mime = ['video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>window.MediaRecorder && MediaRecorder.isTypeSupported(m));
      if (!mime) throw new Error('This browser cannot make videos. Try Chrome or Edge.');
      ext = mime.includes('mp4') ? 'mp4' : 'webm'; banner('Recording the move');
      const rec = new MediaRecorder(rc.captureStream(30), {mimeType:mime, videoBitsPerSecond: MOBILE?8e6:14e6}), chunks=[];
      rec.ondataavailable = e=>{ if (e.data && e.data.size) chunks.push(e.data); };
      rec.start(250);
      await withCanvasSize(W, H, ()=>new Promise(res=>{ const t0=performance.now(), dur=frames/fps*1000;
        const step=()=>{ const el=performance.now()-t0; frameAt(Math.min(frames-1, Math.round(el/1000*fps)));
          $('#recfill').style.width=(Math.min(1,el/dur)*100)+'%'; if (el<dur) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); }));
      await new Promise(r=>{ rec.onstop=r; rec.stop(); });
      blob = new Blob(chunks, {type:mime.split(';')[0]});
    }
  } catch(err){ console.error(err); banner(String(err.message||err)); }
  S.recording=false; $('#recbar').hidden=true; Object.assign(S, base); S.dirtyDraw=true;
  if (blob){ banner(modeText()); showSheet(URL.createObjectURL(blob), 'video', 'first-return.'+ext); }
}

// ---------------------------------------------------------------- interface
const ICON_SAY = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
const sayBtn = text => `<button class="say" data-say="${text.replace(/"/g,'&quot;')}" aria-label="Read aloud">${ICON_SAY}</button>`;
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------------------------------------------------------------- undo
let undoArmed = true;
function snapshot(){ return {P:{...P}, look, picks:S.picks.map(p=>({...p})), band:S.band, shape:S.shape}; }
function pushUndo(){ if (!undoArmed) return; S.undo.push(snapshot()); if (S.undo.length>40) S.undo.shift(); undoArmed=false; }
function commit(){ undoArmed = true; persist(); renderTray(); }
function undo(){
  const s = S.undo.pop(); if (!s) return;
  Object.assign(P, s.P); look=s.look; S.picks=s.picks; S.band=s.band;
  if (s.shape!==S.shape){ S.shape=s.shape; layout(); }
  S.dirtyBuild=true; undoArmed=true; persist(); renderTray(); banner(modeText());
}
function persist(){ store('state', {P, look, shape:S.shape}); }
function isCustom(){ const L=LOOKS[look]; return LOOK_KEYS.some(k=>typeof L[k]==='number' ? Math.abs(L[k]-P[k])>0.02 : L[k]!==P[k]); }

function applyLook(name, keepView){
  pushUndo(); look=name; const L=LOOKS[name];
  LOOK_KEYS.forEach(k=>{ P[k]=L[k]; });
  if (!keepView){ S.yaw=L.yaw; S.pitch=L.pitch; S.zoom=L.zoom; S.pan=[0,0,0]; S.userMoved=false; }
  S.dirtyBuild=true; commit(); viewButton();
}

// ---------------------------------------------------------------- tabs and trays
function setTab(t){
  if (S.tab===t && !WIDE()) t=null;             // on a phone, tapping the open tab closes its tray
  S.tab=t; if (t!=='people' && (S.placing==='face'||S.placing==='label')) S.placing=false;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===t));
  $('#tray').hidden = !t; $('#stage').classList.toggle('picking', t==='subject' || !!S.placing);

}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click', ()=>setTab(b.dataset.tab)));

function modeText(){
  if (S.placing==='face') return 'Tap a face to cover it.';
  if (S.placing==='label') return 'Tap a person or thing to name it.';
  if (S.tab==='subject') return S.picks.length ? 'Tap more things to add them. Tap a ring to remove it.' : 'Tap what matters in the picture.';
  if (S.panMode) return 'Drag to slide the view. Double tap a spot to centre on it.';

}

// What was tapped, found from the photo's own depth rather than from the dots on screen: in the Void
// look most of the background is not drawn, and a tap there used to land on whatever dot was near.
// Within a small radius the nearest surface to the camera wins, so a tap on a person in front of a
// wall picks the person.
function pickPoint(cx, cy){
  if (!S.depth || !S.P) return null;
  const D=S.depth, MV=M4.mul(S.P,S.V), step=Math.max(1, Math.round(Math.sqrt(D.w*D.h/160000)));

  for (let y=0;y<D.h;y+=step) for (let x=0;x<D.w;x+=step){
    const i=y*D.w+x, p=unproject((x+.5)/D.w,(y+.5)/D.h,zOf(D.d[i])), c=M4.xf(MV,p); if (c[3]<=0) continue;
    const sx=(c[0]*.5+.5)*S.cssW, sy=(1-(c[1]*.5+.5))*S.cssH, dd=(sx-cx)**2+(sy-cy)**2;
    if (dd<best){ best=dd; bi=i; bp=p; }
    if (dd<14*14 && c[3]<nearW){ nearW=c[3]; near=i; nearP=p; } }
  if (near>=0){ bi=near; bp=nearP; } else if (bi<0 || best > 44*44) return null;

}

    pushUndo();
    if (hit>=0){ S.picks.splice(hit,1); }
    else {
      // tapping in photo view maps straight to the photo; otherwise use the nearest point
      const hitP=pickPoint(cx,cy); if (!hitP){ undoArmed=true; S.undo.pop(); return; }
      const u=hitP.u, v=hitP.v;
      const pick={u,v}; if (S.sharp) pick.seg = await outlineFor(u,v);

  if (S.placing==='label'){ const p=pickPoint(cx,cy); if (!p) return;

  if (S.anon){ await findFaces(); applyAnon(); }
  // look for people and things first; depth alone decides only when nothing is found
  if (S.autoFind){ const picks = await findThings(); if (picks && picks.length) S.picks = picks; }
  const L=LOOKS[look]; S.yaw=L.yaw; S.pitch=L.pitch; S.zoom=L.zoom; S.pan=[0,0,0]; S.userMoved=false; viewButton();
  S.autoFrame = L.bgTint > 0 && credit !== undefined && !/^Sample/.test(credit||'');   // the stage looks frame the subject
  busy(null); layout(); S.dirtyBuild=true; renderTray(); queueThumbs();
}
$('#file').addEventListener('change', async e=>{
  const f=e.target.files[0]; if (!f) return; e.target.value='';
  try { busy('Opening the photo', null); await tick();
    const ph = await decodePhoto(f);
    const raw = await estimateDepth(ph.canvas);
    await setPhoto(ph, normaliseDepth(raw), 'Your photo stayed on this device.');
  } catch(err){ console.error(err); busy(null); banner('Could not read that photo: '+(err.message||err)); }
});

// ---------------------------------------------------------------- main loop
function frame(){
  if (gl && G){
    if (S.dirtyBuild && !S.recording) build();
    if (S.spin && !S.recording){ S.yaw+=0.25; S.dirtyDraw=true; viewButton(); }
    if (S.dirtyDraw && !S.recording){ S.dirtyDraw=false; draw(); renderLabels(); renderPins(); }
  }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- start
async function boot(){
  if (!initGL()){ banner('This browser has no WebGL2, which drawing the dots needs.'); return; }
  const saved = recall('state');
  look = saved && LOOKS[saved.look] ? saved.look : 'void';
  LOOK_KEYS.forEach(k=>{ P[k]=LOOKS[look][k]; }); P.light = 0;
  if (saved && saved.P) LOOK_KEYS.forEach(k=>{ if (saved.P[k]!=null && typeof saved.P[k]===typeof P[k]) P[k]=saved.P[k]; });
  S.shape = saved && saved.shape ? saved.shape : (MOBILE ? 'photo' : 'wide');
  const L=LOOKS[look]; S.yaw=L.yaw; S.pitch=L.pitch; S.zoom=L.zoom;
  setTab(recall('tab') || 'look');
  layout(); requestAnimationFrame(frame);
  try {
    const [pi, db] = await Promise.all([
      new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('sample')); im.src='sample.jpg'; }),
      fetch('sample-depth.png').then(r=>r.blob())]);
    const c=document.createElement('canvas'); c.width=pi.naturalWidth; c.height=pi.naturalHeight; const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(pi,0,0);
    // decode the 16-bit depth without colour management, which would alter the low byte
    const bmp = await createImageBitmap(db, {colorSpaceConversion:'none', premultiplyAlpha:'none'});
    const d=document.createElement('canvas'); d.width=bmp.width; d.height=bmp.height; const dx=d.getContext('2d',{willReadFrequently:true}); dx.drawImage(bmp,0,0);
    const px=dx.getImageData(0,0,d.width,d.height).data, raw=new Float32Array(d.width*d.height);
    for (let i=0;i<raw.length;i++) raw[i]=(px[i*4]*256+px[i*4+1])/65535;
    S.autoFind = false;             // the sample needs no finder, so opening the page downloads nothing extra
    await setPhoto({canvas:c, w:c.width, h:c.height, data:x.getImageData(0,0,c.width,c.height).data, fov:{tanV:Math.tan(25*Math.PI/180), src:'museum photo, lens assumed'}},
      normaliseDepth({w:d.width, h:d.height, d:raw}),
      'Sample: Abraham Lincoln: The Man (Standing Lincoln), Augustus Saint-Gaudens, The Metropolitan Museum of Art, public domain (CC0).');
    S.autoFind = true;
    // a name over the sample's head, to show what names look like
    requestAnimationFrame(()=>{ const c0=S.comps.slice().sort((a,b)=>b.n-a.n)[0];
      if (c0){ const Lb={u:c0.topUV[0], v:c0.topUV[1], lift:(c0.maxY-c0.minY)*0.07, text:'Standing Lincoln'}; Lb.pos=labelWorld(Lb); S.labels=[Lb]; S.dirtyDraw=true; if (S.tab==='people') renderTray(); } });
  } catch(err){ console.error(err); banner('Tap Open to choose a photo.'); }
}
window.__fr = {S, P, LOOKS, build, setTab, queueThumbs, draw, findThings};   // for testing from the console
boot();

})();
</script>
