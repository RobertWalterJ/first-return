<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0d0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<script>window.coi={coepCredentialless:()=>true,quiet:true};</script>
<script src="coi-serviceworker.js"></script>
</head>
<body>
<title>First Return</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --void:#040506; --panel:#0b0d0f; --raise:#141a1e; --line:#1e2429; --line2:#2d363d;
  --text:#e2e8eb; --dim:#8b98a1; --faint:#5a6770;
  --accent:#72e8cb; --accent-ink:#03140f; --rec:#ff5a4e;
  --ui:Archivo,"Helvetica Neue",Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--void);color:var(--text);font:15px/1.4 var(--ui)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- frame: top bar, picture, tools ---------- */
.app{display:grid;height:100vh;height:100dvh;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "stage" "side"}
.top{grid-area:top;display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-weight:780;font-stretch:125%;letter-spacing:.07em;text-transform:uppercase;font-size:15px;margin-right:auto;white-space:nowrap}
.brand span{color:var(--accent)}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;padding:4px 6px;border:0;background:none;border-radius:6px;font-size:12.5px;color:var(--dim)}
.tb svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb:hover,.tb[aria-expanded="true"]{background:var(--raise);color:var(--text)}
.tb.primary svg{stroke:var(--accent)} .tb.primary{color:var(--accent)}

.stage{grid-area:stage;position:relative;overflow:hidden;background:var(--void);touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{position:absolute;display:block;outline:none;cursor:grab}
.stage.picking canvas{cursor:crosshair}
.compare{position:absolute;pointer-events:none;object-fit:fill}
.overlay{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;color:#fff;font-weight:560;text-shadow:0 0 6px rgba(255,255,255,.55),0 0 16px rgba(255,255,255,.28)}
.pin{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid var(--accent);background:rgba(114,232,203,.25);pointer-events:none}
.msgs{position:absolute;left:12px;right:12px;bottom:64px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.banner,.notice{max-width:100%;background:rgba(8,10,12,.88);border:1px solid var(--line2);border-radius:18px;padding:7px 14px;font-size:14px;text-align:center}
.notice{border-color:var(--accent);color:var(--text);display:flex;align-items:center;gap:10px;text-align:left;padding:6px 14px 6px 6px}
.notice[hidden]{display:none}
.notice .say,.banner .say{pointer-events:auto}
.banner{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px}
.banner[hidden]{display:none}
.panpill{position:absolute;left:10px;top:10px;border:1px solid var(--accent);background:rgba(8,10,12,.88);color:var(--accent);border-radius:16px;padding:7px 12px;font-size:13px}
.pin b{position:absolute;left:50%;top:22px;transform:translateX(-50%);white-space:nowrap;font:600 12px var(--ui);color:var(--accent);text-shadow:0 0 4px #000}
body.locked .side, body.locked .top .tb{pointer-events:none;opacity:.55}
body.scan .tab[data-tab="subject"]{opacity:.5}
.float{position:absolute;right:10px;bottom:10px;display:flex;gap:8px}
.fb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:rgba(10,12,14,.8);display:grid;place-items:center;padding:0}
.fb svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fb[aria-pressed="true"]{border-color:var(--accent)} .fb[aria-pressed="true"] svg{stroke:var(--accent)}
.recbar{position:absolute;left:0;right:0;top:0;height:3px;background:var(--line)}
.recbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--rec)}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,5,6,.74);text-align:center;padding:24px;font-size:15px}
.busy .bar{width:min(260px,70vw);height:3px;background:var(--line2);margin:12px auto 0;position:relative;overflow:hidden;border-radius:2px}
.busy .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0}

/* ---------- tools: tabs + one tray ---------- */
.side{grid-area:side;display:flex;flex-direction:column-reverse;background:var(--panel);border-top:1px solid var(--line);min-height:0}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:var(--safe-b)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border:0;background:none;color:var(--dim);font-size:13px;border-top:2px solid transparent}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
.tray{padding:12px 14px 10px;border-bottom:1px solid var(--line);overflow-y:auto;max-height:44vh;max-height:44dvh}
.tray h3{margin:0 0 8px;font-size:13.5px;font-weight:650;letter-spacing:.01em;color:#b9c4cb;display:flex;align-items:center;gap:8px}
.rowlabel{margin:6px 0 4px;font-size:13px;color:var(--dim)}
.look small{font-size:11.5px;color:var(--dim);padding:0 3px}
.lookpick:disabled{opacity:.6}
.nclose{flex:none;border:0;background:none;color:var(--dim);font-size:15px;padding:4px 6px;pointer-events:auto}
.stop{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:6;border-color:var(--rec);color:#fff;background:rgba(40,8,6,.85)}
.tray h3 .sp{margin-left:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line2);background:var(--raise);border-radius:18px;padding:8px 13px;font-size:14px;line-height:1.1;white-space:nowrap;position:relative}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:#0f2621}
.chipgap{flex:none;width:6px}
.chip.pat{display:inline-flex;align-items:center;gap:8px;padding:6px 13px 6px 8px}
.paticon{width:26px;height:26px;fill:currentColor;opacity:.85}
.chip.def::after{content:"";position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--dim)}
.chip:disabled{opacity:.55;cursor:default}
.btn{border:1px solid var(--line2);background:var(--raise);border-radius:8px;padding:10px 14px;font-weight:560;line-height:1.1}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#1a0302}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.hint{color:var(--dim);font-size:13.5px;margin:8px 0 0;display:flex;gap:8px;align-items:center}
.say{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--raise);display:grid;place-items:center;padding:0}
.say svg{width:16px;height:16px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.looks{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.look{flex:none;width:104px;border:1px solid var(--line2);background:var(--raise);border-radius:8px;padding:5px;display:flex;flex-direction:column;gap:5px;text-align:left}
.look canvas{width:100%;height:78px;border-radius:5px;background:#000;display:block;object-fit:cover}
.look b{font-size:13.5px;font-weight:620;padding:0 3px}
.look[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.look[aria-pressed="true"] b{color:var(--accent)}
.stepper{margin-top:12px}
.stepper input{width:100%;height:36px;accent-color:var(--accent);margin:0}
.stops{display:flex;justify-content:space-between;margin-top:2px}
.stops button{border:0;background:none;color:var(--dim);font-size:12.5px;padding:4px 2px;min-width:44px}
.stops button:first-child{text-align:left} .stops button:last-child{text-align:right}
.stops button[aria-current="true"]{color:var(--accent);font-weight:640}
.sect{margin-top:14px}
.seg{display:flex;gap:4px;overflow-x:auto;background:var(--raise);border:1px solid var(--line2);border-radius:10px;padding:3px}
.segb{flex:1 0 auto;border:0;background:none;color:var(--dim);border-radius:7px;padding:8px 10px;font-size:13.5px;white-space:nowrap}
.segb[aria-selected="true"]{background:var(--panel);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.look.mine{position:relative;padding:0}
.look.mine .lookpick{border:0;background:none;color:inherit;display:flex;flex-direction:column;gap:5px;padding:5px;width:100%;text-align:left}
.lookdel{position:absolute;right:4px;top:4px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);background:rgba(8,10,12,.85);color:var(--text);padding:0}
.nameinput{flex:1;min-width:0;background:var(--raise);border:1px solid var(--line2);border-radius:8px;padding:9px 10px}
.advrow{display:grid;grid-template-columns:92px minmax(0,1fr) 58px auto;gap:8px;align-items:center;margin:8px 0}
.advrow label{font-size:13.5px}
.advrow output{font:12px var(--mono);color:var(--dim);text-align:right}
.advrow input{width:100%;accent-color:var(--accent)}
.chip.small{padding:5px 9px;font-size:12.5px}
.lablist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.lablist div{display:flex;gap:6px}
.lablist input{flex:1;min-width:0;background:var(--raise);border:1px solid var(--line2);border-radius:8px;padding:9px 10px}
.lablist input.fresh{border-color:var(--accent);box-shadow:0 0 0 2px rgba(80,220,190,.25)}
.menu{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:190px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu button{text-align:left;border:0;background:none;padding:10px 12px;border-radius:6px;font-size:14.5px}
.menu button:hover,.menu button[aria-pressed="true"]{background:var(--raise)}
.menu button[aria-pressed="true"]{color:var(--accent)}
.menu small{display:block;color:var(--dim);font-size:12px}
.sheet{position:fixed;inset:0;background:rgba(2,3,4,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px 16px;z-index:30}
.sheet img,.sheet video{max-width:100%;max-height:70vh;border:1px solid var(--line2);background:#000;-webkit-touch-callout:default}
.sheet p{margin:0;color:var(--dim);text-align:center;max-width:52ch}
.info{position:fixed;z-index:25;inset:auto 12px 12px 12px;max-width:420px;margin-left:auto;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--dim)}
.info b{color:var(--text)}
.info p{margin:0 0 8px}

@media (max-width:420px){ .brand{font-size:12.5px;letter-spacing:.04em} .tb{min-width:44px;padding:4px 3px} .top{gap:2px;padding:6px 8px} }
@media (min-width:900px){
  .app{grid-template-columns:minmax(0,1fr) 370px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "stage side"}
  .side{flex-direction:column;border-top:0;border-left:1px solid var(--line)}
  .tabs{border-bottom:1px solid var(--line);padding-bottom:0}
  .tab{border-top:0;border-bottom:2px solid transparent}
  .tab[aria-selected="true"]{border-bottom-color:var(--accent)}
  .tray{max-height:none;flex:1;border-bottom:0;padding:16px 18px}
  .looks{display:grid;grid-template-columns:1fr 1fr;overflow:visible} .look{width:auto} .look canvas{height:auto;aspect-ratio:4/3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">First <span>Return</span></div>
    <button class="tb primary" id="openBtn" aria-haspopup="true" aria-expanded="false" title="Open a photo or a 3D scan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>Open</button>
    <input id="file" type="file" accept="image/*" hidden>
    <input id="fileScan" type="file" accept=".ply,.splat,.spz" hidden>
    <input id="fileLooks" type="file" accept=".json,application/json" hidden>
    <button class="tb" id="shapeBtn" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M6 3v15h15"/><path d="M3 6h15v15"/></svg>Shape</button>
    <button class="tb" id="saveBtn" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>Save</button>
    <button class="tb" id="infoBtn" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.5v.5"/></svg>About</button>
  </header>

  <div class="stage" id="stage">
    <canvas id="gl" tabindex="0" aria-label="The point cloud. Drag to turn it, pinch or scroll to zoom, drag with two fingers to slide it, double tap a spot to centre on it."></canvas>
    <img class="compare" id="compare" alt="" hidden>
    <canvas class="compare" id="dbgView" hidden></canvas>
    <div class="overlay" id="pins"></div>
    <div class="overlay" id="labels"></div>
    <div class="msgs"><div class="notice" id="notice" role="status" aria-live="polite" hidden></div><div class="banner" id="banner" role="status" aria-live="polite" hidden></div></div>
    <button class="btn stop" id="stopBtn" hidden>Stop</button>
    <button class="panpill" id="panPill" hidden>Pan on. Tap to turn off</button>
    <div class="recbar" id="recbar" hidden><i id="recfill"></i></div>
    <div class="float">
      <button class="fb" id="photoView" aria-label="Line up with the photo" title="Line up with the photo" hidden><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/></svg></button>
      <button class="fb" id="panBtn" aria-pressed="false" aria-label="Pan: drag slides the view" title="Pan: drag slides the view"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><path d="M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg></button>
      <button class="fb" id="spin" aria-pressed="false" aria-label="Turntable" title="Turntable"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="15" rx="8" ry="3"/><path d="M12 12V4"/><path d="M16 7l-4-3-4 3"/></svg></button>
      <button class="fb" id="compareBtn" aria-label="Hold to see the original photo" title="Hold to see the original photo"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/><path d="M12 9l9 6"/></svg></button>
    </div>
    <div class="busy" id="busy" role="status" aria-live="polite" hidden><div><div id="busyText">Working</div><div class="bar"><i id="busyBar"></i></div></div></div>
  </div>

  <aside class="side">
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="look"><svg viewBox="0 0 24 24"><circle cx="7" cy="8" r="1.4"/><circle cx="12" cy="6" r="1.4"/><circle cx="17" cy="8" r="1.4"/><circle cx="9" cy="13" r="1.4"/><circle cx="15" cy="13" r="1.4"/><circle cx="12" cy="18" r="1.4"/></svg>Look</button>
      <button class="tab" role="tab" data-tab="adjust"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Adjust</button>
      <button class="tab" role="tab" data-tab="subject"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Subject</button>
      <button class="tab" role="tab" data-tab="move"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>Move</button>
      <button class="tab" role="tab" data-tab="people"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/></svg>People</button>
    </nav>
    <section class="tray" id="tray"></section>
  </aside>
</div>

<div class="menu" id="openMenu" hidden></div>
<div class="menu" id="shapeMenu" hidden></div>
<div class="menu" id="saveMenu" hidden></div>
<div class="info" id="info" hidden></div>
<div class="sheet" id="sheet" hidden>
  <img id="sheetImg" alt="Your picture">
  <video id="sheetVid" controls loop muted playsinline hidden></video>
  <p id="sheetNote"></p>
  <div class="row"><button class="btn primary" id="sheetShare" hidden>Share</button><a class="btn" id="sheetDl" href="#">Download</a><button class="btn" id="sheetClose">Close</button></div>
</div>

<script>
(() => {
'use strict';
// ---------------------------------------------------------------- core: constants, state, settings
const $ = s => document.querySelector(s);
const MOBILE = matchMedia('(pointer:coarse)').matches;
const MAXPTS = MOBILE ? 520000 : 1150000;
const WIDE = () => matchMedia('(min-width:900px)').matches;
const PITCH_SIGN = 1;      // how edge convergence maps to the horizon row (checked against a synthetic photo)

// Every adjustable setting has named stops. The slider moves smoothly between them and snaps
// to a stop when you tap its name, so there is always a sensible preset one tap away.
const CONTROLS = [
  {key:'dots',     name:'Amount',     hint:'How many dots make up the picture.', rebuild:true,
   stops:[['Few',6],['Some',28],['Many',55],['Lots',75],['Max',92]]},
  {key:'pattern',  name:'Pattern',    hint:'How the dots are laid out: scattered like a handheld scan, in rings like a spinning lidar, or on an even grid.', rebuild:true, chips:[
     ['scatter','Scatter'],['rings','Scan rings'],['grid','Grid']]},
  {key:'size',     name:'Dot size',   hint:'How big each dot is.',
   stops:[['Fine',.55],['Small',.8],['Medium',1.05],['Big',1.5],['Huge',2.3]]},
  {key:'glow',     name:'Glow',       hint:'Light that spills around the bright dots.',
   stops:[['Off',0],['Soft',.45],['Medium',.9],['Strong',1.4],['Bloom',2.1]]},
  {key:'bright',   name:'Brightness', hint:'How bright the dots are.',
   stops:[['Dim',.6],['Soft',.9],['Normal',1.25],['Bright',1.8],['Blazing',2.7]]},
  {key:'light',    name:'Shadows',    hint:'Brings dark or backlit subjects out of shadow by evening out the light. Real lidar sees surfaces, not sunlight.',
   stops:[['As shot',0],['Lifted',.5],['Even',1]]},
  {key:'colour',   name:'Colour',     hint:'What decides the colour of each dot.', chips:[
     ['photo','Photo'],['muted','Muted'],['grey','Grey'],['range','Distance'],['height','Height'],['phosphor','Green']]},
  {key:'depth3d',  name:'Depth',      hint:'How far near things stand out from far things. Easiest to see when you turn the view.', rebuild:true,
   stops:[['Flat',.08],['Low',.5],['Normal',1],['Deep',1.6],['Extra',2.4]]},
  {key:'backdrop', name:'Background', hint:'Dots behind and around the subject. None leaves the subject alone on a black stage.', rebuild:true,
   stops:[['None',0],['Faint',.12],['Some',.4],['Full',1]]},
  {key:'floor',    name:'Floor',      hint:'A scatter of dots on the ground under the subject.', rebuild:true,
   stops:[['Off',0],['Some',.55],['Full',1.1]]},
  {key:'hidden',   name:'Hidden parts', hint:'Fills in what the photo could not see: the background behind things, and the backs of people and objects. It shows when you turn or slide the view.', rebuild:true,
   stops:[['Off',0],['Behind',1],['Behind and backs',2]]},
  {key:'edges',    name:'Outlines',   hint:'Dark outlines where near meets far, the way lidar viewers shade a scan.',
   stops:[['Off',0],['Soft',.9],['Strong',2.2]]},
];
const CTRL = Object.fromEntries(CONTROLS.map(c=>[c.key,c]));
// Adjust is organised by what a control changes, so each group stays short.
const GROUPS = [
  {id:'dots',  name:'Dots',             keys:['dots','size']},     // Pattern is a style, so it sits on the Look tab
  {id:'light', name:'Light and colour', keys:['bright','glow','light','colour','edges']},
  {id:'scene', name:'Scene',            keys:['depth3d','backdrop','floor','hidden']},
  {id:'advanced', name:'Advanced',      keys:[]},
];

// Looks set every control plus a few things that are part of the style itself.
// Control values are positions on the stops (0 = first stop, 1 = second, fractions in between).
const LOOKS = {

// ---------------------------------------------------------------- choosing the subject
// Automatic: everything nearer than a depth threshold (floor excluded) is the subject.
function autoComponents(){

  for (let s=0;s<n;s++){
    if (map[s]!==-1 || D.d[s]<cut || G[s]) continue;
    let head=0, tail=0; q[tail++]=s; const id=comps.length; map[s]=id; let area=0;
    while(head<tail){ const i=q[head++]; area++; const x=i%D.w;
      if (x>0){ const j=i-1; if (map[j]===-1 && D.d[j]>=cut && !G[j]){ map[j]=id; q[tail++]=j; } }
      if (x<D.w-1){ const j=i+1; if (map[j]===-1 && D.d[j]>=cut && !G[j]){ map[j]=id; q[tail++]=j; } }
      if (i>=D.w){ const j=i-D.w; if (map[j]===-1 && D.d[j]>=cut && !G[j]){ map[j]=id; q[tail++]=j; } }
      if (i<n-D.w){ const j=i+D.w; if (map[j]===-1 && D.d[j]>=cut && !G[j]){ map[j]=id; q[tail++]=j; } } }
    comps.push(area);

  const remap=[]; let k=0; comps.forEach((a,i)=>{ remap[i] = a >= n*0.004 ? k++ : -1; });
  for (let i=0;i<n;i++) if (map[i]>=0) map[i]=remap[map[i]];
  return map;
}

// Tapped: grow outward from the tap across surfaces at about the same depth, stopping at
// depth cliffs. Things in front of the subject are no longer mistaken for it.
const BANDS = [0.045, 0.085, 0.15];
function growFrom(pick, id, map){
  const D=S.depth, n=D.w*D.h, G=S.ground, W=D.w;
  const sx=Math.min(W-1,(pick.u*W)|0), sy=Math.min(D.h-1,(pick.v*D.h)|0);
  let seed=sy*W+sx;
  // A tap on something the floor finder claimed only because it faces up (the top of a boat on a
  // shoulder, a table) means "this": let the tap win. A tap on a fitted floor plane means "the thing
  // standing here", so move to the nearest pixel that is not floor.
  const onUp = G[seed]===4;
  if (G[seed] && !onUp){ let best=-1, bd=1e9; const r=Math.round(W*0.03);
    for (let y=Math.max(0,sy-r);y<Math.min(D.h,sy+r);y++) for (let x=Math.max(0,sx-r);x<Math.min(W,sx+r);x++){ const i=y*W+x; if (!G[i]){ const dd=(x-sx)**2+(y-sy)**2; if (dd<bd){bd=dd; best=i;} } }
    if (best>=0) seed=best; }
  const rel = (D.d[seed] + S.shiftAuto)/(0.5 + S.shiftAuto), tau = BANDS[S.band]*rel, step = (0.018 + 0.01*S.band)*rel;

    const vals=[]; for (let i=0;i<n;i+=3) if (seg[i]) vals.push(D.d[i]);
    // keep the outline's own depth range (an object can reach towards you), dropping only strays well off it
    if (vals.length > 20){ vals.sort((a,b)=>a-b); lo=vals[Math.floor(vals.length*0.05)]-tau; hi=vals[Math.floor(vals.length*0.95)]+tau; }
    else seg = null;

  const bx = pick.box;                        // a found thing stays inside its own box
  const inBox = j => { if (!bx) return true; const u=(j%W+.5)/W, v=(((j/W)|0)+.5)/D.h; return u>=bx[0] && u<=bx[2] && v>=bx[1] && v<=bx[3]; };

    // ...then let it grow into neighbours whose depth carries on smoothly: the outline model often skips
    // dark clothing, but a jacket's depth runs straight on from the face and hands. Depth maps blur edges,
    // so smoothness alone would creep into the background; growth must also stay clearly nearer than the
    // background inside the box (at least halfway from it to the thing). Where the two are too close to
    // tell apart, the outline is used as it is.
    const inside=[], behind=[];
    for (let i=0;i<n;i+=2){ if (!inBox(i)) continue; (seg[i] ? inside : behind).push(D.d[i]); }
    inside.sort((a,b)=>a-b); behind.sort((a,b)=>a-b);
    const thing = inside[inside.length>>1], back = behind.length > 50 ? behind[Math.floor(behind.length*0.25)] : -1;
    if (!(thing - back > tau)){ area=tail; return area; }

    const okGrow = j => map[j]===-1 && G[j]!==9 && (!G[j] || G[j]===4) && D.d[j]>=floorD && D.d[j]<=hi && inBox(j);
    while(head<tail){ const i=q[head++]; area++; const x=i%W, di=D.d[i];

  }

  while(head<tail){ const i=q[head++]; area++; const x=i%W, di=D.d[i];
    const tryJ = j => { if (ok(j) && Math.abs(D.d[j]-di) < step){ map[j]=id; q[tail++]=j; } };
    if (x>0) tryJ(i-1); if (x<W-1) tryJ(i+1); if (i>=W) tryJ(i-W); if (i<n-W) tryJ(i+W); }

}
function subjectMap(){
  // cached: the subject only depends on the depth, the picks and the band, not on the look
  const key = S.depthVer+'|'+S.band+'|'+S.autoCut+'|'+S.picks.map(p=>p.u.toFixed(4)+','+p.v.toFixed(4)+(p.seg?'s':'')+(p.box?p.box.join(','):'')).join(';');
  if (S.compCache && S.compCache.key===key) return S.compCache.map;
  let map;

    map = new Int32Array(S.depth.w*S.depth.h).fill(-1); let area=0;
    S.picks.forEach((p,i)=>{ area += growFrom(p, i, map); });

    if (area < map.length*0.003) map = autoComponents();
  }

  return map;

}
let segP = null;
function loadSegmenter(quiet){

// The outline model gains almost nothing from more than about 1024 pixels (masks agree 99.6% with
// the full photo) and runs faster on less, so it gets a reduced copy.
let segInput = null;
function outlineInput(){
  const c = S.photoCanvas, L = 1024, s = L/Math.max(c.width, c.height);
  if (s >= 1) return c;
  if (segInput && segInput.src===c) return segInput.canvas;
  const o = document.createElement('canvas'); o.width=Math.round(c.width*s); o.height=Math.round(c.height*s); o.getContext('2d').drawImage(c,0,0,o.width,o.height);

async function outlineFor(u, v, stroke){
  if (!segmenter && segP){ busy('Starting the outline finder', null); }
  const seg = await loadSegmenter(); if (!seg) return null;
  busy('Finding the outline', null); await tick();
  try {
    const res = seg.segment(outlineInput(), stroke ? {scribble:stroke} : {keypoint:{x:u, y:v}});
    const m = res.categoryMask, mw = m.width, mh = m.height, a = m.getAsUint8Array();

// ---------------------------------------------------------------- find people and things (MediaPipe object detector)
// Depth alone cannot tell that the person behind the dinner table is the point of the photo. A small
// object detector (EfficientDet Lite0, Apache 2.0) finds people, animals and vehicles; each one is then
// outlined with Magic Touch using a stroke down its middle, kept inside its box, and checked against depth.
let detector = null, detFailed = false, detP = null;
const SKIP = new Set(['dining table','chair','bench','couch','bed','potted plant','tv','toilet','sink','refrigerator','oven','microwave','book','vase','clock','cup','bowl','bottle','wine glass','fork','knife','spoon','cell phone','remote','keyboard','mouse','laptop']);
function loadDetector(quiet){
  if (detector || detFailed) return Promise.resolve(detector);
  return detP || (detP = (async ()=>{
    try {
      const bufs = await fetchVisionModels(quiet);
      if (!quiet){ busy('Starting the finder', null); await tick(); }
      const fileset = await visionFileset();
      detector = await Vision.ObjectDetector.createFromOptions(fileset, {
        baseOptions:{modelAssetPath:URL.createObjectURL(new Blob([bufs.det])), delegate:'CPU'},
        scoreThreshold:0.35, maxResults:12, runningMode:'IMAGE'});
    } catch(err){ console.error(err); detFailed = true; detector = null; }
    if (!quiet) busy(null);
    detP = null; return detector;
  })());
}
async function findThings(){
  if (!detector && detP) busy('Starting the finder', null);      // an early start is still finishing
  const det = await loadDetector(); if (!det) return null;
  busy('Looking for people and things', null); await tick();
  const W = S.photoCanvas.width, H = S.photoCanvas.height;
  let found = [];
  try {
    const r = det.detect(S.photoCanvas);
    for (const d of r.detections){
      const c = d.categories[0]; if (!c || SKIP.has(c.categoryName)) continue;
      const b = d.boundingBox, x0=b.originX/W, y0=b.originY/H, x1=(b.originX+b.width)/W, y1=(b.originY+b.height)/H;
      if ((x1-x0)*(y1-y0) < 0.004) continue;
      found.push({name:c.categoryName, score:c.score, box:[x0,y0,x1,y1]});
    }
  } catch(err){ console.error(err); busy(null); return null; }
  // people first, then the biggest things; at most five
  const area = f => (f.box[2]-f.box[0])*(f.box[3]-f.box[1]);
  found.sort((a,b)=>((b.name==='person')-(a.name==='person')) || (area(b)-area(a)));
  found = found.slice(0, MOBILE ? 3 : 5);
  const picks = [];
  for (const f of found){
    const [x0,y0,x1,y1] = f.box, cx=(x0+x1)/2, pad=0.04, D=S.depth;
    // The outline is guided by a stroke drawn down the person. A box cut off by the frame edge (a selfie)
    // has empty background at its centre, so each stroke point goes on the nearest part of the thing in
    // its row of the box instead.
    const stroke = [0.25,0.4,0.55,0.7].map(t=>{ const vy=y0+(y1-y0)*t, yi=Math.min(D.h-1,(vy*D.h)|0); let bx=cx, bd=-1;
      for (let k=0;k<40;k++){ const ux=x0+(x1-x0)*(k+.5)/40, d=D.d[yi*D.w+Math.min(D.w-1,(ux*D.w)|0)]; if (d>bd){ bd=d; bx=ux; } }

      const dd=D.d[Math.min(D.h-1,(vv*D.h)|0)*D.w+Math.min(D.w-1,(uu*D.w)|0)]; if (dd>best){ best=dd; su=uu; sv=vv; } }

  }

}

// Each point is 10 floats: position (3), photo colour (3), kind, random, luminance, incidence.

// 4 = the subject's filled-in back. Which subject a point belongs to is kept

//    depth and colour.

function parseSplatFile(buf){
  const n = Math.floor(buf.byteLength/32); if (n < 1) throw new Error('this .splat file is empty');
  const step = Math.max(1, Math.ceil(n/(MOBILE ? 1.5e6 : 4e6))), f = new Float32Array(buf, 0, n*8), u = new Uint8Array(buf);
  const sp = newSplats(Math.ceil(n/step)); let m=0;

    if (!isFinite(f[o]) || !isFinite(f[o+1]) || !isFinite(f[o+2])) continue;
    sp.pos[m*3]=f[o]; sp.pos[m*3+1]=f[o+1]; sp.pos[m*3+2]=f[o+2];
    sp.scl[m*3]=f[o+3]; sp.scl[m*3+1]=f[o+4]; sp.scl[m*3+2]=f[o+5];
    sp.rgba.set(u.subarray(b+24,b+28), m*4);
    for (let k=0;k<4;k++) sp.rot[m*4+k]=(u[b+28+k]-128)/128;
    m++; }

}

function levelSplats(sp, Rm, shift){

// The splats to draw now: the scan's own, or this photo's (made again only when what they depend on changed).
function currentSplats(){

  if (!S.photo || !S.depth || !S.compMap) return null;

// ---------------------------------------------------------------- saving splats
// .spz (Niantic, version 2): gzip over a 16-byte header then positions (24-bit fixed point), opacities,
// colours, sizes and rotations, packed per attribute. Roughly a tenth of the .ply. Right, up, back frame,
// which is this app's own, so nothing is turned.
async function saveSplatSpz(){
  const sp = currentSplats(); if (!sp || !sp.n) return;
  busy('Making the splat file', null); await tick();
  const N=sp.n; let ext=0; for (let i=0;i<N*3;i++) ext=Math.max(ext, Math.abs(sp.pos[i]));
  const fb = Math.max(4, Math.min(16, 22 - Math.ceil(Math.log2(Math.max(1, ext)))));    // as fine as the scene's size allows

  for (let i=0;i<N;i++){
    for (let k=0;k<3;k++){ let v=Math.round(sp.pos[i*3+k]*one); v=Math.max(-8388608, Math.min(8388607, v)) & 0xffffff; const o=oP+i*9+k*3; raw[o]=v&255; raw[o+1]=(v>>8)&255; raw[o+2]=(v>>16)&255;

      raw[oS+i*3+k]=clamp255(Math.round((Math.log(Math.max(1e-9, sp.scl[i*3+k]))+10)*16)); }

// Standard 3DGS .ply (position, base colour, opacity, log sizes, rotation), turned into the usual
// y-down, z-forward frame so SuperSplat, Polycam and other splat viewers show it the right way up.
async function saveSplatPly(){
  const sp = currentSplats(); if (!sp || !sp.n) return;
  busy('Making the splat file', null); await tick();
  const props=['x','y','z','f_dc_0','f_dc_1','f_dc_2','opacity','scale_0','scale_1','scale_2','rot_0','rot_1','rot_2','rot_3'];
  // the floats that follow must start on a 4-byte boundary, so the comment is padded to fit
  let pad = '', head;
  for (;;){ head = `ply\nformat binary_little_endian 1.0\ncomment First Return splats${pad}\nelement vertex ${sp.n}\n${props.map(p=>'property float '+p).join('\n')}\nend_header\n`;
    if (new TextEncoder().encode(head).length % 4 === 0) break; pad += ' '; }
  const hb = new TextEncoder().encode(head), buf = new ArrayBuffer(hb.length + sp.n*props.length*4); new Uint8Array(buf).set(hb);
  const f = new Float32Array(buf, hb.length);
  let k=0;
  for (let i=0;i<sp.n;i++){
    f[k++]=sp.pos[i*3]; f[k++]=-sp.pos[i*3+1]; f[k++]=-sp.pos[i*3+2];
    for (let c=0;c<3;c++) f[k++]=(sp.rgba[i*4+c]/255-0.5)/SH_C0;
    const a=Math.min(0.995, Math.max(0.005, sp.rgba[i*4+3]/255)); f[k++]=Math.log(a/(1-a));
    for (let c=0;c<3;c++) f[k++]=Math.log(Math.max(1e-7, sp.scl[i*3+c]));

    const w=sp.rot[i*4], x=sp.rot[i*4+1], y=sp.rot[i*4+2], z=sp.rot[i*4+3];
    f[k++]=-x; f[k++]=w; f[k++]=-z; f[k++]=y;
  }
  const blob = new Blob([buf], {type:'application/octet-stream'}), url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='first-return-splats.ply'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000); busy(null);
  notice(`Saved first-return-splats.ply, ${sp.n.toLocaleString()} splats, ${(buf.byteLength/1e6).toFixed(0)} MB. It opens in SuperSplat and other splat viewers.`);
}

uniform mat4 uProj, uView; uniform float uPx, uExposure, uSat, uBgTint, uBgGain, uBgSize, uSparkle, uFocus, uLight, uOrbit, uFxT, uTime, uFxK; uniform int uMode, uFx, uMix;
uniform vec2 uR, uY;

out vec3 vCol; flat out float vRound;

const PTS_FS = `#version 300 es
precision mediump float; in vec3 vCol; flat in float vRound; out vec4 o;
void main(){ if(vRound>.5){ vec2 p=gl_PointCoord*2.-1.; if(dot(p,p)>1.) discard; } o=vec4(vCol,0.); }`;   // alpha 0: a dot, not photo
const QUAD_VS = `#version 300 es
out vec2 vUv; void main(){ vec2 p=vec2((gl_VertexID<<1)&2, gl_VertexID&2); vUv=p; gl_Position=vec4(p*2.-1.,0.,1.); }`;
const BRIGHT_FS = `#version 300 es
precision highp float; in vec2 vUv; uniform sampler2D uTex; uniform vec2 uTexel; out vec4 o;
void main(){ vec2 h=uTexel*.5; vec4 s=(texture(uTex,vUv+vec2(-h.x,-h.y))+texture(uTex,vUv+vec2(h.x,-h.y))+texture(uTex,vUv+vec2(-h.x,h.y))+texture(uTex,vUv+vec2(h.x,h.y)))*.25;

const BLUR_FS = `#version 300 es
precision highp float; in vec2 vUv; uniform sampler2D uTex; uniform vec2 uDir; out vec4 o;
void main(){ vec3 s=texture(uTex,vUv).rgb*.227;

const COMP_FS = `#version 300 es
precision highp float; in vec2 vUv; uniform sampler2D uScene, uGlowA, uGlowB, uDepth; uniform float uGlow, uEdl, uNear, uFar, uRaw, uGlitch, uTime; uniform vec2 uRes; out vec4 o;
float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
float lz(float d){ float z=(2.*uNear*uFar)/(uFar+uNear-(d*2.-1.)*(uFar-uNear)); return log2(z); }
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }

function initGL(){
  gl = cv.getContext('webgl2', {antialias:false, alpha:false, preserveDrawingBuffer:false, powerPreference:'high-performance'});
  if (!gl) return false;
  const half = !!gl.getExtension('EXT_color_buffer_float');
  const sh=(type,src)=>{ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog=(vs,fs)=>{ const p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); const u={}; const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS); for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i); u[a.name]=gl.getUniformLocation(p,a.name);} return {p,u}; };
  G = {half, P:prog(PTS_VS,PTS_FS), SP:prog(SPLAT_VS,SPLAT_FS), B:prog(QUAD_VS,BRIGHT_FS), Bl:prog(QUAD_VS,BLUR_FS), C:prog(QUAD_VS,COMP_FS),
       quad:gl.createVertexArray(), clouds:{}, targets:{}};
  return true;
}
function cloudBuffer(key){
  if (G.clouds[key]) return G.clouds[key];
  const vao=gl.createVertexArray(), vbo=gl.createBuffer();
  gl.bindVertexArray(vao); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,40,0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,3,gl.FLOAT,false,40,12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,4,gl.FLOAT,false,40,24);
  gl.bindVertexArray(null);
  return G.clouds[key] = {vao, vbo, count:0};
}
function uploadCloud(out, n, key='main'){
  const c = cloudBuffer(key); gl.bindBuffer(gl.ARRAY_BUFFER, c.vbo); gl.bufferData(gl.ARRAY_BUFFER, out.subarray(0,n*10), gl.STATIC_DRAW); c.count = n;
}
function targets(w,h,key){
  const old = G.targets[key]; if (old && old.w===w && old.h===h) return old;
  if (old){ [old.sT,old.dT,old.a,old.b,old.c,old.d].forEach(x=>gl.deleteTexture(x)); [old.sF,old.aF,old.bF,old.cF,old.dF].forEach(x=>gl.deleteFramebuffer(x)); }
  const fmt = G.half ? [gl.RGBA16F, gl.HALF_FLOAT] : [gl.RGBA8, gl.UNSIGNED_BYTE];
  const tex=(w,h,depth)=>{ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
    if (depth) gl.texImage2D(gl.TEXTURE_2D,0,gl.DEPTH_COMPONENT24,w,h,0,gl.DEPTH_COMPONENT,gl.UNSIGNED_INT,null);
    else gl.texImage2D(gl.TEXTURE_2D,0,fmt[0],w,h,0,gl.RGBA,fmt[1],null);
    const f = depth ? gl.NEAREST : gl.LINEAR;
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,f); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,f);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE); return t; };
  const fbo=(t,d)=>{ const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
    if (d) gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,d,0); return f; };
  const hw=Math.max(1,w>>1), hh=Math.max(1,h>>1), qw=Math.max(1,w>>2), qh=Math.max(1,h>>2);
  const T={w,h,hw,hh,qw,qh, sT:tex(w,h), dT:tex(w,h,true), a:tex(hw,hh), b:tex(hw,hh), c:tex(qw,qh), d:tex(qw,qh)};
  T.sF=fbo(T.sT,T.dT); T.aF=fbo(T.a); T.bF=fbo(T.b); T.cF=fbo(T.c); T.dF=fbo(T.d);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return G.targets[key]=T;
}

// ---------------------------------------------------------------- camera
function frameAspect(){ const pa = S.photo ? S.photo.w/S.photo.h : 1;
  return S.shape==='wide'?16/9:S.shape==='square'?1:S.shape==='tall'?9/16:pa; }
function viewMatrix(yaw, pitch, zoom, pivot, pan){
  // yaw = pitch = 0, zoom = 1 and no pan is exactly the photo's own viewpoint. Turning happens about
  // the pivot; pan slides the camera in its own plane (and along its axis when the pivot is re-centred).
  const t = pivot || S.target, pn = pan || [0,0,0], back = (zoom-1)*S.refDist;
  // straightening first, then the turn, so the view orbits about the true vertical
  const R = M4.mul(M4.rx(pitch*Math.PI/180), M4.mul(M4.ry(yaw*Math.PI/180), M4.rz(S.roll)));
  return M4.mul(M4.tr(-pn[0],-pn[1],-back-pn[2]), M4.mul(M4.tr(t[0],t[1],t[2]), M4.mul(R, M4.tr(-t[0],-t[1],-t[2]))));
}
function viewTan(aspect){ const pa = S.photo ? S.photo.w/S.photo.h : 1; return aspect < pa ? S.tanV*pa/aspect : S.tanV; }
function projMatrix(aspect){
  const pa = S.photo ? S.photo.w/S.photo.h : 1;
  return M4.persp(2*Math.atan(viewTan(aspect)), aspect, 0.05, 400);   // tall frames keep the photo's width
}

// Render one cloud at W x H into the canvas (viewport origin bottom left).
function renderView(W, H, o){
  const T = targets(W, H, o.targetKey||'main');
  const aspect = W/H, V = o.thumb ? viewMatrix(o.yaw, o.pitch, o.zoom, S.target, null) : viewMatrix(o.yaw, o.pitch, o.zoom, S.pivot, S.pan), Pm = projMatrix(aspect);

  o.splatFx = {sweep:1, resolve:1, decay:2, glitch:3, build:5, dissolve:5, dust:7}[fx]||0; o.mix = mix;

    gl.uniformMatrix4fv(u.uProj,false,Pm); gl.uniformMatrix4fv(u.uView,false,V);
    // point size at the subject's distance scales with the output height, so exports match the preview
    const ref = Math.abs(S.target[2]) || 2, pa = S.photo.w/S.photo.h, fitH = aspect < pa ? H*aspect/pa : H;
    gl.uniform1f(u.uPx, o.size * 1.62 * fitH/1000 * ref * (0.466/S.tanV));
    gl.uniform1f(u.uExposure, o.bright); gl.uniform1f(u.uSat, o.colour==='muted' ? .45 : 1);
    gl.uniform1f(u.uBgTint, L.bgTint); gl.uniform1f(u.uBgGain, L.bgGain); gl.uniform1f(u.uBgSize, L.bgSize);
    gl.uniform1f(u.uSparkle, L.sparkle); gl.uniform1f(u.uFocus, o.focus ? 1 : 0); gl.uniform1f(u.uLight, o.light||0);

    gl.uniform1f(u.uOrbit, Math.min(1, (Math.abs(o.yaw)+Math.abs(o.pitch))/8 + slid*8));

    gl.uniform1i(u.uFx, ptFx); gl.uniform1f(u.uFxT, o.fxT||0); gl.uniform1f(u.uTime, o.fxTime||0); gl.uniform1f(u.uFxK, fxK); gl.uniform1i(u.uMix, both ? mix : 0);

  pass(G.Bl, T.bF, T.hw, T.hh, u=>{ tx(0,T.a); gl.uniform1i(u.uTex,0); gl.uniform2f(u.uDir,k/T.hw,0); });

    gl.uniform1i(u.uScene,0); gl.uniform1i(u.uGlowA,1); gl.uniform1i(u.uGlowB,2); gl.uniform1i(u.uDepth,3);

function viewOpts(extra){
  return Object.assign({cloud:G.clouds.main||{count:0}, look, colour:P.colour, size:val('size'), bright:val('bright'), glow:val('glow'), light:val('light'),
    edges:val('edges'), yaw:S.yaw, pitch:S.pitch, zoom:S.zoom, focus:S.tab==='subject' && !S.recording, sync:!!S.exporting, fx:S.fxNow||'none', fxT:S.fxT||0, fxTime:S.fxTime||0}, extra||{});

// ---------------------------------------------------------------- drawing splats
// Each splat becomes a screen-facing quad shaped by its 3D size and rotation seen from the camera (the
// standard 3DGS projection: the 3D covariance through the view and the perspective Jacobian), drawn
// back to front with premultiplied blending. Splats live in one integer texture, two texels each:
// position and colour, then the covariance as six halves plus a flag. A worker sorts them by depth
// while you move, so turning stays smooth; exports sort in place so every frame is exact.
const SPLAT_VS = `#version 300 es
precision highp float; precision highp int;
uniform highp usampler2D uData; uniform mat4 uProj, uView; uniform vec2 uFocal, uVp, uR;
uniform float uCovK, uExposure, uOrbit, uFxT, uTime, uLin, uFxK, uFocus; uniform int uFx, uMix;
layout(location=0) in vec2 aCorner; layout(location=1) in uint aIndex;
out vec4 vCol; out vec2 vPos;
float hsh(float n){ return fract(sin(n*12.9898+4.1)*43758.5453); }
// an integer hash: sin() hashes lose precision at large inputs, so neighbouring splats (one row of the
// photo) got nearly the same number and moved together in streaks

float hf(uint x){ return float(hu(x)>>8)/16777216.; }
void main(){

  uvec4 t0 = texelFetch(uData, tc, 0), t1 = texelFetch(uData, tc+ivec2(1,0), 0);
  vec3 p = uintBitsToFloat(t0.xyz);
  vec4 col = vec4(float(t0.w & 255u), float((t0.w>>8)&255u), float((t0.w>>16)&255u), float(t0.w>>24))/255.;
  float rnd = hf(aIndex), grow = 1.;
  float r = clamp((length(p)-uR.x)/(uR.y-uR.x), 0., 1.);
  if((t1.w & 1u) == 1u) col.a *= uOrbit;                       // hidden parts show as the view turns
  bool subj = (t1.w & 2u) == 2u;                                  // mixed looks: 1 photo subject only, 2 everything else
  if((uMix==1 && !subj) || (uMix==2 && subj)) col.a = 0.;
  if(uFx==1){ if(r > uFxT*1.15) col.a = 0.; }                   // sweep and resolve: only what the beam has reached
  if(uFx==2){ float st=rnd*.7, k=clamp((uFxT-st)/(1.-st), 0., 1.);   // decay: each splat lets go in turn and drifts off
    vec3 dir = normalize(vec3(hf(aIndex*3u+1u)-.5, hf(aIndex*3u+2u)-.25, hf(aIndex*3u+3u)-.5));

  float mid = .5*(a+c), rad = length(vec2(.5*(a-c), b)), l1 = mid+rad, l2 = max(mid-rad, .1);

  vec2 e1 = min(3.*sqrt(l1), 1024.)*d1, e2 = min(3.*sqrt(l2), 1024.)*vec2(d1.y,-d1.x);

  if(uFx==1){ float e = 1.-smoothstep(0., .02+.025*uFxK, abs(r-uFxT*1.15)); rgb = mix(rgb, vec3(.55,1.,.9), e*min(.8,.65*uFxK)); }   // the beam's edge

const SPLAT_FS = `#version 300 es
precision highp float; in vec4 vCol; in vec2 vPos; out vec4 o;
void main(){ float A = dot(vPos,vPos); if(A > 9.) discard; float a = vCol.a*exp(-.5*A); if(a < 1./255.) discard; o = vec4(vCol.rgb*a, a); }`;

// Sorting: back to front along the view direction, by a 16-bit counting sort (one pass, no comparisons).
function sortSplatIndex(pos, n, v){

  for (let i=0;i<n;i++){ const d = v[2]*pos[i*3] + v[6]*pos[i*3+1] + v[10]*pos[i*3+2]; z[i]=d; if (d<mn) mn=d; if (d>mx) mx=d; }

  for (let k=1;k<65536;k++) counts[k]+=counts[k-1];

  for (let i=n-1;i>=0;i--) idx[--counts[keys[i]]] = i;

const SORT_WORKER = `let pos=null, n=0; ${sortSplatIndex.toString()}
onmessage = e => { const d=e.data; if (d.pos){ pos=d.pos; n=d.n; return; }
  const idx = sortSplatIndex(pos, n, d.view); postMessage({idx, id:d.id, set:d.set}, [idx.buffer]); };`;

const _hf = new Float32Array(1), _hu = new Uint32Array(_hf.buffer);

  gl.bindVertexArray(vao);

  const Sg = G.splat, id = viewKey(V); if (Sg.sortedFor===id) return;

// catches up a frame or two behind while the view moves.

// ---------------------------------------------------------------- faces: find and anonymise
let faceSession = null;
async function loadFaceModel(){
  if (faceSession) return faceSession;
  await ensureOrt();
  const r = await cachedFetch('models/face-yunet-2023mar.onnx');
  faceSession = await ort.InferenceSession.create(new Uint8Array(await r.arrayBuffer()), {executionProviders:['wasm'], logSeverityLevel:3});
  return faceSession;
}
// YuNet (OpenCV Zoo, MIT) takes a 640 x 640 BGR image and reports faces at three scales. The whole
// photo is letterboxed in without stretching; large photos are also read in overlapping tiles, so
// small faces in full-length shots are big enough to find. It is tuned toward finding every face:
// a covered sleeve does no harm, a missed face does.
async function detectFaces(canvas){
  const sess = await loadFaceModel(), W = canvas.width, H = canvas.height, N = 640;
  const c = document.createElement('canvas'); c.width=N; c.height=N; const x=c.getContext('2d',{willReadFrequently:true});
  const crops = [{sx:0, sy:0, sw:W, sh:H, thr:0.6}];
  if (Math.max(W,H) > 1000){ const t=Math.round(Math.max(W,H)*0.55);
    for (const fy of [0, 1]) for (const fx of [0, 1]) crops.push({sx:fx*(W-Math.min(t,W)), sy:fy*(H-Math.min(t,H)), sw:Math.min(t,W), sh:Math.min(t,H), thr:0.7}); }
  const boxes=[];
  for (const k of crops){
    const s = Math.min(N/k.sw, N/k.sh);
    x.fillStyle='#000'; x.fillRect(0,0,N,N); x.drawImage(canvas, k.sx,k.sy,k.sw,k.sh, 0,0,k.sw*s,k.sh*s);
    const px=x.getImageData(0,0,N,N).data, t=new Float32Array(3*N*N);
    for (let i=0;i<N*N;i++){ t[i]=px[i*4+2]; t[N*N+i]=px[i*4+1]; t[2*N*N+i]=px[i*4]; }
    const r = await sess.run({[sess.inputNames[0]]: new ort.Tensor('float32', t, [1,3,N,N])});
    for (const st of [8,16,32]){ const cols=N/st, cls=r['cls_'+st].data, obj=r['obj_'+st].data, bb=r['bbox_'+st].data;
      for (let i=0;i<cls.length;i++){ const sc=Math.sqrt(Math.min(1,Math.max(0,cls[i]))*Math.min(1,Math.max(0,obj[i]))); if (sc < k.thr) continue;
        const cx=((i%cols)+bb[i*4])*st, cy=(Math.floor(i/cols)+bb[i*4+1])*st, w=Math.exp(bb[i*4+2])*st, h=Math.exp(bb[i*4+3])*st;
        const b=[(k.sx+(cx-w/2)/s)/W, (k.sy+(cy-h/2)/s)/H, (k.sx+(cx+w/2)/s)/W, (k.sy+(cy+h/2)/s)/H];
        if (b[2]-b[0] > 0.003 && b[3]-b[1] > 0.003) boxes.push({s:sc, b}); } }
  }
  boxes.sort((a,b)=>b.s-a.s); const keep=[];

  // a little larger than the detected box, which is tight on the features
  return keep.map(f=>({cx:(f.b[0]+f.b[2])/2, cy:(f.b[1]+f.b[3])/2, rx:(f.b[2]-f.b[0])*0.72, ry:(f.b[3]-f.b[1])*0.72, auto:true}));
}

async function findFaces(){

function addFaceAt(u, v, comp){

  let ry = 0.05; const c = S.comps.find(k=>k.id===comp);

let sheetURL = null, sheetFile = null;
// The phone's own share sheet (WhatsApp, Instagram, Photos...). Chrome accepts pictures and videos;

function canShareFile(file){ try { return !!(navigator.canShare && navigator.canShare({files:[file]})); } catch(e){ return false; } }

  if (!canShareFile(file)) return false;

  return true; }

async function savePly(){
  if (!S.count) return;
  busy('Making the 3D file', null); await tick();
  const n=S.count, out=S.cpu;
  const head = `ply\nformat binary_little_endian 1.0\ncomment First Return point cloud, units are relative\nelement vertex ${n}\nproperty float x\nproperty float y\nproperty float z\nproperty uchar red\nproperty uchar green\nproperty uchar blue\nend_header\n`;
  const hb = new TextEncoder().encode(head), buf = new ArrayBuffer(hb.length + n*15); new Uint8Array(buf).set(hb); const dv=new DataView(buf);
  for (let i=0;i<n;i++){ const o=i*10, p=hb.length+i*15; dv.setFloat32(p,out[o],true); dv.setFloat32(p+4,out[o+1],true); dv.setFloat32(p+8,out[o+2],true);

// ---------------------------------------------------------------- camera moves
// Moves are small and slow by default, the drift of documentary footage: long durations, smootherstep
// easing (a slower start and stop than a plain ease), and a Strength that scales every move and effect
// together. Old moves at Strong match what they used to be. dz zoom, dy turn, dp tilt, px/py slide
// (in units of the subject's distance).
const STRENGTH = [['gentle','Gentle',0.4],['medium','Medium',0.75],['strong','Strong',1.25]];
const strength = () => (STRENGTH.find(s=>s[0]===S.strength)||STRENGTH[0])[2];
const MOVES = {
  push:  (t,k)=>({dz:-0.32*k*t}),
  pull:  (t,k)=>({dz:0.28*k*t}),
  slide: (t,k)=>({px:(t-0.5)*0.22*k, dy:(0.5-t)*7*k}),          // a sideways dolly, turning a little to hold the subject
  float: (t,k)=>({dy:Math.sin(t*2*Math.PI)*6*k, dp:Math.sin(t*4*Math.PI)*2.2*k, dz:-0.05*k*Math.sin(t*Math.PI)}),   // ends where it began: loops
  orbit: (t,k)=>({dy:(-14+28*t)*k}),
  drift: (t,k)=>({dz:-0.26*t*k, dy:(-8+16*t)*k, dp:(4-4*t)*k}),
  rise:  (t,k)=>({py:0.12*t*k, dp:10*t*k, dz:-0.1*t*k})           // the camera rises and looks down a touch
};
const MOVE_NAMES = [['push','Push in'],['pull','Pull out'],['slide','Slide'],['float','Float'],['drift','Drift'],['orbit','Orbit'],['rise','Rise']];
const LOOPING = new Set(['float']);
const ease = t => t*t*t*(t*(6*t-15)+10);
function poseAt(base, move, t){
  const tt = Math.min(1,Math.max(0,t)), m = MOVES[move](LOOPING.has(move) ? tt : ease(tt), strength()), R = S.refDist||2;
  return {yaw:base.yaw+(m.dy||0), pitch:Math.max(-80,Math.min(80,base.pitch+(m.dp||0))), zoom:Math.max(0.3, base.zoom*(1+(m.dz||0))),
    pan:[base.pan[0]+(m.px||0)*R, base.pan[1]+(m.py||0)*R, base.pan[2]]}; }
const viewBase = () => ({yaw:S.yaw, pitch:S.pitch, zoom:S.zoom, pan:S.pan.slice()});

// portion: play only the opening of the move at its real speed (a quick look when a chip is tapped)
// peek: a quick look from a chip tap, which leaves the controls free (the next tap cuts it off).
// Stop ends any preview or video early.
async function previewMove(move, secs, portion=1, peek=false){
  if (S.recording || !S.count) return;
  const base=viewBase(), dur=secs*1000*portion;
  S.recording=true; S.peeking=peek; S.stopReq=false; S.spin=false; syncSpin(); $('#recbar').hidden=false; $('#stopBtn').hidden=false;
  if (!peek) document.body.classList.add('locked');
  banner(portion<1 ? 'Playing the start of the move' : 'Playing the move');
  S.fxNow = S.fx||'none';
  await new Promise(res=>{ const t0=performance.now(); const step=()=>{ const el=performance.now()-t0, t=Math.min(1,el/dur)*portion;
    Object.assign(S, poseAt(base, move, t)); S.fxT=t; S.fxTime=el/1000; draw(); renderLabels(); renderPins();
    $('#recfill').style.width=(Math.min(1,el/dur)*100)+'%'; if (el<dur && !S.stopReq) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); });
  S.recording=false; S.peeking=false; S.stopReq=false; S.fxNow='none'; $('#recbar').hidden=true; $('#stopBtn').hidden=true; document.body.classList.remove('locked'); Object.assign(S, base); S.dirtyDraw=true; banner(modeText());
}
$('#stopBtn').addEventListener('click', ()=>{ S.stopReq = true; });

// Frame by frame with WebCodecs: every frame is rendered at its exact time, so a slow phone makes a
// slower export, never a jerky video. Older browsers fall back to recording the screen in real time.
async function recordMove(move, secs){
  if (S.recording || !S.count) return;
  const base=viewBase(), fps=30, hold=Math.round(fps*(LOOPING.has(move)?0:0.4)), frames=Math.round(secs*fps)+2*hold;
  const [W,H] = exportSize(MOBILE ? 1280 : 1920, 1920);
  const rc=document.createElement('canvas'); rc.width=W; rc.height=H; const rx=rc.getContext('2d');
  const frameAt = i => { const t=(i-hold)/(frames-2*hold-1); Object.assign(S, poseAt(base, move, t)); S.fxT=Math.min(1,Math.max(0,t)); S.fxTime=i/fps; draw(W,H); rx.drawImage(cv,0,0); drawLabels2D(rx,W,H); };
  S.recording=true; S.exporting=true; S.stopReq=false; S.fxNow=S.fx||'none'; S.spin=false; syncSpin(); $('#recbar').hidden=false; $('#stopBtn').hidden=false; document.body.classList.add('locked'); stayAwake(true);
  let blob=null, ext='mp4';
  try {
    let config=null;
    if (window.VideoEncoder){
      if (!window.Mp4Muxer) await loadScript('vendor/mp4-muxer.js');
      for (const codec of ['avc1.640028','avc1.4D4028','avc1.42E028','avc1.42001f']){
        const c={codec, width:W, height:H, bitrate: MOBILE?8e6:14e6, framerate:fps};
        try { const s=await VideoEncoder.isConfigSupported(c); if (s.supported){ config=c; break; } } catch(e){}
      }
    }
    if (config){
      banner('Making the video');
      const muxer = new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(), video:{codec:'avc', width:W, height:H}, fastStart:'in-memory'});
      let failed=null;
      const enc = new VideoEncoder({output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta), error:e=>{ failed=e; }});
      enc.configure(config);
      await withCanvasSize(W, H, async ()=>{
        for (let i=0;i<frames && !failed && !S.stopReq;i++){
          frameAt(i);
          const vf = new VideoFrame(rc, {timestamp:Math.round(i*1e6/fps), duration:Math.round(1e6/fps)});
          enc.encode(vf, {keyFrame: i%60===0}); vf.close();
          while (enc.encodeQueueSize > 4) await new Promise(r=>setTimeout(r,4));
          $('#recfill').style.width=((i+1)/frames*100)+'%';
          if (i%6===0) await new Promise(r=>setTimeout(r,0));
        }
        await enc.flush();
      });
      enc.close(); if (failed) throw failed;
      muxer.finalize(); blob = new Blob([muxer.target.buffer], {type:'video/mp4'});
    } else {
      const mime = ['video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>window.MediaRecorder && MediaRecorder.isTypeSupported(m));
      if (!mime) throw new Error('This browser cannot make videos. Try Chrome or Edge.');
      ext = mime.includes('mp4') ? 'mp4' : 'webm'; banner('Recording the move');
      const rec = new MediaRecorder(rc.captureStream(30), {mimeType:mime, videoBitsPerSecond: MOBILE?8e6:14e6}), chunks=[];
      rec.ondataavailable = e=>{ if (e.data && e.data.size) chunks.push(e.data); };
      rec.start(250);
      await withCanvasSize(W, H, ()=>new Promise(res=>{ const t0=performance.now(), dur=frames/fps*1000;
        const step=()=>{ const el=performance.now()-t0; frameAt(Math.min(frames-1, Math.round(el/1000*fps)));
          $('#recfill').style.width=(Math.min(1,el/dur)*100)+'%'; if (el<dur) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); }));
      await new Promise(r=>{ rec.onstop=r; rec.stop(); });
      blob = new Blob(chunks, {type:mime.split(';')[0]});
    }
  } catch(err){ console.error(err); notice('The video could not be made: '+String(err.message||err)); }
  const stopped = S.stopReq; if (stopped){ blob=null; notice('Stopped. No video was saved.'); }
  S.recording=false; S.exporting=false; S.stopReq=false; S.fxNow='none'; $('#recbar').hidden=true; $('#stopBtn').hidden=true; document.body.classList.remove('locked'); stayAwake(false); Object.assign(S, base); S.dirtyDraw=true;
  if (blob){ banner(modeText()); showSheet(URL.createObjectURL(blob), 'video', 'first-return.'+ext, blob); }
}

// ---------------------------------------------------------------- picking up where you left off
// A phone often throws a page away while you are in another app, and coming back reloads it. The work
// in progress is kept on this device (IndexedDB, never uploaded) so it comes back as it was: the photo
// and its depth (or the scan file), what was picked, names, hidden faces, settings and the view.
// The photo is saved once per photo; the rest after each change and whenever the page goes to the back.
const SESSION_DB = 'first-return-session';
function sessionDb(){
  return new Promise((res, rej)=>{ const r = indexedDB.open(SESSION_DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function sessionPut(key, value){
  try { const db = await sessionDb(); await new Promise((res, rej)=>{ const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(value, key);
    t.oncomplete = res; t.onerror = () => rej(t.error); }); db.close(); } catch(e){ console.warn('could not keep the work for later', e); }
}
async function sessionGet(key){
  try { const db = await sessionDb(); const v = await new Promise((res, rej)=>{ const r = db.transaction('kv').objectStore('kv').get(key);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); db.close(); return v; } catch(e){ return null; }
}
const canvasBlob = c => new Promise(r=>c.toBlob(r, 'image/jpeg', 0.92));

let mediaId = null;
async function saveMedia(m){
  mediaId = 'm' + Date.now().toString(36); m.id = mediaId;
  await sessionPut('media', m); saveSessionNow();
}
// What is needed to rebuild the work on top of the saved photo or scan.
function sessionState(){
  return {v:1, media:mediaId, savedAt:Date.now(),
    picks: S.picks.map(p=>({u:p.u, v:p.v, name:p.name, box:p.box, seg:p.seg||null})), band:S.band, sharp:!!S.sharp,
    labels: S.labels.map(L=>({u:L.u, v:L.v, lift:L.lift, fixed:L.fixed, text:L.text})),
    faces: S.faces.map(f=>({...f})), facesFound:S.facesFound, anon:S.anon, anonLevel:S.anonLevel,
    view: {yaw:S.yaw, pitch:S.pitch, zoom:S.zoom, pan:S.pan.slice(), pivot:S.pivot.slice(), home:S.home, userMoved:S.userMoved, refDist:S.refDist},
    adv: {fov:S.adv.fov, ratio:S.adv.ratio, roll:S.adv.roll, beams:S.adv.beams, noise:S.adv.noise},
    light:P.light, lightAuto:S.lightAuto};
}
function saveSessionNow(){ if (!mediaId || S.isSample || S.restoring) return; sessionPut('state', sessionState()); }
let sessionQueued = false;
function queueSessionSave(){ if (sessionQueued) return; sessionQueued = true;
  window.requestIdleCallback ? requestIdleCallback(()=>{ sessionQueued=false; saveSessionNow(); }, {timeout:2000}) : setTimeout(()=>{ sessionQueued=false; saveSessionNow(); }, 800); }
// going to the back is the moment that matters: the page may not get another chance
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='hidden') saveSessionNow(); });
addEventListener('pagehide', saveSessionNow);

async function restoreSession(){
  const m = await sessionGet('media'); if (!m) return false;
  const st = await sessionGet('state'); const ok = st && st.media===m.id ? st : null;
  const g = ++S.gen; S.restoring = true;
  try {
    busy('Picking up where you left off', null); await tick();
    if (m.kind==='scan'){ await openScan(m.file); if (g!==S.gen) return true; }
    else {
      const bmp = await createImageBitmap(m.blob), c = document.createElement('canvas'); c.width=bmp.width; c.height=bmp.height;
      const x = c.getContext('2d', {willReadFrequently:true}); x.drawImage(bmp, 0, 0);
      const ph = {canvas:c, w:c.width, h:c.height, data:x.getImageData(0,0,c.width,c.height).data, fov:m.fov, url:URL.createObjectURL(m.blob)};
      const anon = ok && ok.anon; S.anon = false;               // faces come back from the saved list, not a new search
      await setPhoto(ph, m.depth, m.credit, {picks: ok ? ok.picks.map(p=>({...p, seg:p.seg||undefined})) : []});
      if (g!==S.gen) return true;
      if (ok){
        S.band = ok.band; S.sharp = ok.sharp;
        S.faces = ok.faces||[]; S.facesFound = !!ok.facesFound; S.anonLevel = ok.anonLevel; S.anon = !!anon; applyAnon();
        if (ok.light!=null){ S.autoLight = false; P.light = ok.light; S.lightAuto = ok.lightAuto; }
      }
    }
    mediaId = m.id;
    if (ok){
      Object.assign(S.adv, ok.adv);
      if (S.adv.fov) S.tanV = Math.tan(S.adv.fov*Math.PI/360);
      if (S.adv.roll!=null) S.roll = S.adv.roll*Math.PI/180;
      S.labels = (ok.labels||[]).map(L=>{ const o={...L}; if (!o.fixed) delete o.fixed; o.pos = labelWorld(o); return o; });
      // a saved view is used only if it is made of real numbers (an unfinished framing once saved NaN)
      const V = ok.view, good = V && [V.yaw, V.pitch, V.zoom, ...(V.pan||[]), ...(V.pivot||[])].every(Number.isFinite) && V.pan.length===3 && V.pivot.length===3;
      if (good){ S.autoFrame = false; S.reframe = false;
        Object.assign(S, {yaw:V.yaw, pitch:V.pitch, zoom:V.zoom, pan:V.pan, pivot:V.pivot, home:V.home, userMoved:V.userMoved});
        if (V.refDist > 0){ S.refDist = V.refDist; S.refFrozen = true; } }
    }
    S.dirtyBuild = true; busy(null); renderTray(); viewButton();
    notice('Back where you left off. Open starts something new.');
    return true;
  } catch(err){
    console.error(err); busy(null); sessionPut('media', null); mediaId = null; return false;   // a damaged save is dropped, and the sample loads
  } finally { S.restoring = false; }
}

const ICON_SAY = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>';

// ---------------------------------------------------------------- undo
let undoArmed = true;
function snapshot(){ return {P:{...P}, look, activeMine:S.activeMine, picks:S.picks.map(p=>({...p})), band:S.band, shape:S.shape, level:S.level}; }
function pushUndo(){ if (!undoArmed) return; S.undo.push(snapshot()); if (S.undo.length>40) S.undo.shift(); undoArmed=false; }
function commit(){ undoArmed = true; persist(); renderTray(); }
function undo(){
  const s = S.undo.pop(); if (!s) return;
  Object.assign(P, s.P); look=s.look; S.activeMine=s.activeMine||null; S.picks=s.picks; S.band=s.band;
  if (s.shape!==S.shape){ S.shape=s.shape; layout(); }
  if (s.level!==S.level){ S.level=s.level; S.roll = S.level ? S.rollAuto : 0; }
  S.dirtyBuild=true; undoArmed=true; persist(); renderTray(); banner(modeText());
}
function persist(){ store('state', {P, look, shape:S.shape, level:S.level, activeMine:S.activeMine, move:S.move, moveLen:S.moveLen, fx:S.fx, strength:S.strength, exportLong:S.adv.exportLong}); queueSessionSave(); }
// ---------------------------------------------------------------- my looks: save, apply, share
function myLooks(){ const v=recall('myLooks'); return Array.isArray(v) ? v : []; }
function saveMyLooks(list){ store('myLooks', list); }
function activePreset(){ const m = S.activeMine && myLooks().find(x=>x.id===S.activeMine); return m ? {...LOOKS[m.base], ...m.values, name:m.name} : LOOKS[look]; }
function applyMine(id, keepView){
  const m = myLooks().find(x=>x.id===id); if (!m || !LOOKS[m.base]) return;
  if (!lookAvailable(m.base)){ notice(`"${m.name}" is based on ${LOOKS[m.base].name}, which needs ${S.scan ? 'a photo' : 'splats'}.`); return; }
  pushUndo(); look=m.base; const L=LOOKS[look];
  LOOK_KEYS.forEach(k=>{ P[k] = m.values[k]!=null ? m.values[k] : L[k]; });
  S.activeMine=id;
  if (!keepView){ S.yaw=L.yaw; S.pitch=L.pitch; S.zoom=L.zoom; S.pan=[0,0,0]; S.userMoved=false; S.home=null; S.reframe = L.bgTint>0 && !S.isSample && !S.scan; }
  S.dirtyBuild=true; commit(); viewButton();
}
function saveCurrentLook(name){
  const list=myLooks(), values={}; LOOK_KEYS.forEach(k=>{ values[k]=P[k]; });
  const id='m'+Date.now().toString(36);
  list.push({id, name:(name||'My look').slice(0,40), base:look, values}); saveMyLooks(list);
  S.activeMine=id; persist(); queueThumbs(); notice('Saved "'+(name||'My look')+'". It is under My looks.');
}
function exportLooks(){
  const list=myLooks(); if (!list.length){ notice('Save a look first, then you can share it.'); return; }
  const blob=new Blob([JSON.stringify({app:'First Return', kind:'looks', version:1, looks:list}, null, 1)], {type:'application/json'});
  if (shareFile(blob, 'first-return-looks.json')) return;
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='first-return-looks.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
  notice(`Saved ${list.length} look${list.length===1?'':'s'} to first-return-looks.json. Open it with Load looks on another device.`);
}
async function importLooks(file){
  try {
    const data=JSON.parse(await file.text()); const incoming=Array.isArray(data) ? data : data.looks;
    if (!Array.isArray(incoming)) throw new Error('no looks in that file');
    const list=myLooks(); let added=0;
    for (const m of incoming){
      if (!m || typeof m.name!=='string' || !LOOKS[m.base] || typeof m.values!=='object') continue;
      const values={}; LOOK_KEYS.forEach(k=>{ const v=m.values[k]; if (v!=null && typeof v===typeof LOOKS[m.base][k]) values[k]=v; });
      if (list.some(x=>x.name===m.name && JSON.stringify(x.values)===JSON.stringify(values))) continue;
      list.push({id:'m'+Date.now().toString(36)+added, name:m.name.slice(0,40), base:m.base, values}); added++;
    }
    saveMyLooks(list); queueThumbs(); renderTray();
    notice(added ? `Loaded ${added} look${added===1?'':'s'}.` : 'Those looks are already here.');
  } catch(err){ notice('Could not load that file: '+(err.message||err)); }
}
function isCustom(){ const L=activePreset(); return LOOK_KEYS.some(k=>typeof L[k]==='number' ? Math.abs(L[k]-P[k])>0.02 : L[k]!==P[k]); }

function applyLook(name, keepView){
  if (keepView && S.activeMine){ applyMine(S.activeMine, true); P.light = S.lightAuto; S.dirtyBuild=true; commit(); return; }   // Reset look returns to the saved look, view kept
  pushUndo(); look=name; const L=LOOKS[name]; S.activeMine=null;
  LOOK_KEYS.forEach(k=>{ P[k]=L[k]; });
  if (keepView) P.light = S.lightAuto;          // Reset look also returns Light to what the photo needed
  if (!keepView){ S.yaw=L.yaw; S.pitch=L.pitch; S.zoom=L.zoom; S.pan=[0,0,0]; S.userMoved=false; S.home=null; S.reframe = L.bgTint>0 && !S.isSample && !S.scan; }
  S.dirtyBuild=true; commit(); viewButton();
}

// ---------------------------------------------------------------- tabs and trays
function setTab(t){
  if (S.tab===t && !WIDE()) t=null;             // on a phone, tapping the open tab closes its tray
  S.tab=t; if (t!=='people' && (S.placing==='face'||S.placing==='label')) S.placing=false;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===t));
  $('#tray').hidden = !t; $('#stage').classList.toggle('picking', t==='subject' || !!S.placing);
  renderTray(); banner(modeText()); S.dirtyDraw=true; renderPins(); showDebug();
  requestAnimationFrame(layout);
  if (t) store('tab', t);
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click', ()=>{ notice(''); setTab(b.dataset.tab); }));

function modeText(){
  if (S.placing==='face') return 'Tap a face to cover it.';
  if (S.placing==='label') return 'Tap a person or thing to name it.';
  if (S.tab==='subject') return S.picks.length ? 'Tap more things to add them. Tap a ring to remove one.' : 'Tap Find, or tap what matters in the picture.';
  return '';
}

function renderTray(){

      ${[['Dots', k=>!LOOKS[k].splat], ['Photo', k=>LOOKS[k].splat]].map(([title, test])=>{ const ks=Object.keys(LOOKS).filter(k=>test(k) && lookAvailable(k)); return ks.length ? `<p class="rowlabel">${title}</p><div class="looks">${ks.map(k=>`<button class="look" data-look="${k}" aria-pressed="${k===look && !S.activeMine}"><canvas id="thumb-${k}" width="208" height="156"></canvas><b>${LOOKS[k].name}</b></button>`).join('')}</div>` : ''; }).join('')}

      <div class="scroller pats">${CTRL.pattern.chips.map(([v,n])=>`<button class="chip pat" data-pat="${v}" aria-pressed="${P.pattern===v}">${PAT_ICON[v]}${n}</button>`).join('')}</div>`}
      <div class="sect row"><button class="chip" id="resetLook" ${custom?'':'disabled'}>Reset look</button>${undoBtn}</div>

          : `<div class="row" style="margin-top:8px"><button class="chip" id="saveLook">Save this look</button><button class="chip" id="shareLooks" ${mine.length?'':'disabled'}>Share looks</button><button class="chip" id="loadLooks">Load looks</button>${S.lastRemoved?`<button class="chip" id="bringBack">Bring back ${esc(S.lastRemoved.m.name)}</button>`:''}</div>`}

    tr.querySelectorAll('[data-look]').forEach(b=>b.addEventListener('click',()=>applyLook(b.dataset.look)));
    tr.querySelectorAll('[data-mine]').forEach(b=>b.addEventListener('click',()=>applyMine(b.dataset.mine)));
    tr.querySelectorAll('[data-pat]').forEach(b=>b.addEventListener('click',()=>{ if (P.pattern===b.dataset.pat) return; pushUndo(); P.pattern=b.dataset.pat; S.dirtyBuild=true; commit(); }));
    tr.querySelectorAll('[data-delmine]').forEach(b=>b.addEventListener('click',()=>{ const id=b.dataset.delmine, m=myLooks().find(x=>x.id===id);
      const list=myLooks(); S.lastRemoved = m ? {m, at:list.findIndex(x=>x.id===id)} : null;
      saveMyLooks(list.filter(x=>x.id!==id)); if (S.activeMine===id) S.activeMine=null; persist(); renderTray(); notice('Removed "'+(m?m.name:'look')+'".'); }));
    if ($('#bringBack')) $('#bringBack').addEventListener('click',()=>{ const r=S.lastRemoved; if (!r) return; const list=myLooks();
      if (!list.some(x=>x.id===r.m.id)) list.splice(Math.max(0,Math.min(list.length,r.at)),0,r.m); saveMyLooks(list); S.lastRemoved=null; queueThumbs(); renderTray(); notice('"'+r.m.name+'" is back.'); });
    $('#resetLook').addEventListener('click',()=>applyLook(look, true));

    if ($('#shareLooks')) $('#shareLooks').addEventListener('click', exportLooks);
    if ($('#loadLooks')) $('#loadLooks').addEventListener('click',()=>$('#fileLooks').click());
    paintThumbs();
  }
  else if (S.tab==='adjust' && S.group==='advanced'){
    renderAdvanced(tr);
  }
  else if (S.tab==='adjust'){
    if (!groupKeys(S.group).length) S.group = GROUPS.find(g=>groupKeys(g.id).length).id;

    } else {

      ${body}<p class="hint">${sayBtn(c.hint+note)}<span>${c.hint}${note}</span></p>
      <div class="sect row">${undoBtn}</div>`;
    tr.querySelectorAll('[data-ctrl]').forEach(b=>b.addEventListener('click',()=>{ S.ctrl=b.dataset.ctrl; renderTray(); }));
    if ($('#levelChip')) $('#levelChip').addEventListener('click',()=>{ pushUndo(); S.level=!S.level; S.roll = S.level ? S.rollAuto : 0; S.adv.roll=null; S.dirtyDraw=true; commit(); });
    tr.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{ pushUndo(); P[c.key]=b.dataset.choice; if (c.rebuild) S.dirtyBuild=true; S.dirtyDraw=true; commit(); }));
    wireGroupRow(tr);
    const r = $('#ctl');
    if (r){
      r.addEventListener('input', ()=>{ pushUndo(); P[c.key]=+r.value; if (c.key==='floor') S.floorTouched=true; if (c.rebuild){ S.lowDetail=true; S.dirtyBuild=true; } S.dirtyDraw=true; markStops(c); });
      r.addEventListener('change', ()=>{ if (c.rebuild){ S.lowDetail=false; S.dirtyBuild=true; } commit(); });
      tr.querySelectorAll('[data-stop]').forEach(b=>b.addEventListener('click',()=>{ pushUndo(); P[c.key]=+b.dataset.stop; if (c.key==='floor') S.floorTouched=true; if (c.rebuild){ S.lowDetail=false; S.dirtyBuild=true; } S.dirtyDraw=true; commit(); }));
    }
  }
  else if (S.tab==='subject' && S.scan){
    tr.innerHTML = `<p class="hint" style="margin:0">${sayBtn('A scan keeps every point it measured, so there is no subject to pick. Use Background under Adjust, Scene to thin out its floor.')}<span>A scan keeps every point it measured, so there is no subject to pick. Use Background under Adjust, Scene to thin out its floor.</span></p>`;
  }
  else if (S.tab==='subject'){
    const outlined = S.sharp || S.picks.some(p=>p.seg);
    const sHint = LOOKS[look].splat && !LOOKS[look].mix ? 'In Photoreal the subject shows only while this tab is open. It shapes Real subject and Real setting, and every dot look.' : 'Tap Find, or tap the thing that matters. It becomes the subject even if something else is nearer.';
    const sHint2 = outlined ? 'Outlines come from an outline finder, part of the 23 MB finder download.' : 'Tighter keeps only what sits at the same depth as your tap. Looser takes in more.';

      ${S.picks.length ? `<div class="scroller" style="margin-bottom:8px">${S.picks.map((p,i)=>`<button class="chip" data-unpick="${i}" aria-label="Remove ${esc(pickName(p,i))}">${esc(pickName(p,i))} &#x2715;</button>`).join('')}</div>` : ''}
      <div class="scroller"><button class="chip" id="autoSub" aria-pressed="${!S.picks.length}">Nearest things</button>
      ${['Tighter','Normal','Looser'].map((n,i)=>`<button class="chip" data-band="${i}" aria-pressed="${S.band===i}">${n}</button>`).join('')}

      if (!picks.length){ notice('Nothing found. Tap what matters instead.'); return; }
      pushUndo(); S.picks = picks; protectFound(picks); S.dirtyBuild = true; S.reframe=true; commit();
      notice('Found '+describePicks(picks)+'.');
    });
    tr.querySelectorAll('[data-band]').forEach(b=>b.addEventListener('click',()=>{ pushUndo(); S.band=+b.dataset.band; S.dirtyBuild=true; commit(); }));
    $('#sharp').addEventListener('click', async ()=>{ const g=S.gen; S.sharp=!outlined; renderTray();
      if (S.sharp && S.picks.length){ for (const p of S.picks) if (!p.seg){ const m = await outlineFor(p.u,p.v); if (g!==S.gen) return; p.seg = m; } S.dirtyBuild=true; }
      if (!S.sharp){ S.picks.forEach(p=>{ delete p.seg; }); S.dirtyBuild=true; renderTray(); }

    const nameRows = S.labels.map((L,i)=>`<div><input id="label-${i}" value="${esc(L.text)}" placeholder="Name" aria-label="Name ${i+1}"><button class="chip" data-del="${i}" aria-label="Remove name ${i+1}">Remove</button></div>`).join('');
    tr.innerHTML = S.scan ? `<p class="hint" style="margin:0 0 10px">${sayBtn('Faces can only be found in photos. Names work on scans too.')}<span>Faces can only be found in photos. Names work on scans too.</span></p><div class="sect"><h3>Names</h3><div class="row"><button class="chip" id="addLabel" aria-pressed="${S.placing==='label'}">+ Name</button></div>
      <div class="lablist">${nameRows}</div></div>` : `<h3>Faces</h3>
      <div class="scroller"><button class="chip" id="anon" aria-pressed="${S.anon}">Hide faces</button>
      ${['Light','Medium','Strong'].map((n,i)=>`<button class="chip" data-level="${i}" aria-pressed="${S.anon&&S.anonLevel===i}">${n}</button>`).join('')}
      <button class="chip" id="addFace" aria-pressed="${S.placing==='face'}">+ Face</button>${S.faces.length?'<button class="chip" id="clearFaces">Clear</button>':''}</div>
      <p class="hint">${sayBtn(pHint)}<span>${pHint}</span></p>
      <div class="sect"><h3>Names</h3><div class="row"><button class="chip" id="addLabel" aria-pressed="${S.placing==='label'}">+ Name</button></div>
      <div class="lablist">${nameRows}</div></div>`;
    if ($('#anon')) $('#anon').addEventListener('click', async ()=>{ S.anon=!S.anon; if (S.anon && !S.facesFound) await findFaces(); applyAnon(); invalidateCompare(); queueThumbs(); renderTray(); });
    tr.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click', async ()=>{ S.anonLevel=+b.dataset.level; if (!S.anon){ S.anon=true; if (!S.facesFound) await findFaces(); } applyAnon(); invalidateCompare(); queueThumbs(); renderTray(); }));
    if ($('#addFace')) $('#addFace').addEventListener('click',()=>setPlacing('face'));
    const cf=$('#clearFaces'); if (cf) cf.addEventListener('click',()=>{ S.faces=[]; S.facesFound=false; S.anon=false; applyAnon(); invalidateCompare(); queueThumbs(); renderTray(); });
    $('#addLabel').addEventListener('click',()=>setPlacing('label'));
    S.labels.forEach((L,i)=>{ $('#label-'+i).addEventListener('input',e=>{ L.text=e.target.value; S.dirtyDraw=true; }); });
    tr.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{ S.labels.splice(+b.dataset.del,1); renderTray(); S.dirtyDraw=true; }));
  }
  tr.querySelectorAll('.scroller [aria-pressed="true"], .looks [aria-pressed="true"]').forEach(b=>{ const sc=b.parentElement; sc.scrollLeft = b.offsetLeft - sc.clientWidth/2 + b.offsetWidth/2; });
  const u=$('#undoBtn'); if (u) u.addEventListener('click', undo);
  tr.querySelectorAll('[data-say]').forEach(b=>b.addEventListener('click',()=>say(b.dataset.say)));
}
// Waiting for a tap on the picture. This must not go through setTab: on a phone, re-selecting the open
